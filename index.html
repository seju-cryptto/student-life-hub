
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students Hub</title>
<style>
*{box-sizing:border-box}
:root{
--accent:#c7b5ff;
--text:#29243b;
--glass:rgba(255,255,255,.78);
}
body{
margin:0;font-family:Segoe UI,Arial,sans-serif;
color:var(--text);min-height:100vh;
background:linear-gradient(135deg,#e8ddff,#d8edff,#fbe4ef);
background-size:cover;background-position:center;
transition:.3s;
}
body.dark{
--text:#f1edff;
--glass:rgba(28,25,45,.82);
background:linear-gradient(135deg,#151425,#29223f,#172c40);
}
button,input,textarea,select{font:inherit}
button{
border:none;border-radius:12px;padding:10px 14px;
cursor:pointer;background:var(--accent);color:#302445;
transition:.2s;
}
button:hover{transform:translateY(-2px);filter:brightness(1.04)}
.desk{
min-height:100vh;padding:24px 24px 90px;
}
.topbar{
display:flex;justify-content:space-between;
align-items:center;flex-wrap:wrap;gap:12px;
}
.brand{font-size:25px;font-weight:800}
.datebox{padding:12px 18px;background:var(--glass);
backdrop-filter:blur(15px);border-radius:18px}
.desktop{
display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));
gap:18px;margin-top:25px;align-items:start;
}
.widget{
background:var(--glass);backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.25);
padding:20px;border-radius:23px;
box-shadow:0 12px 40px rgba(40,25,70,.10);
min-width:0;
}
.widget h3{margin:0 0 14px}
.widget.dragging{opacity:.5}
.draghead{cursor:grab}
.wide{grid-column:span 2}
input,textarea,select{
width:100%;padding:12px;border-radius:12px;
border:1px solid #cfc4e9;margin:7px 0;
background:rgba(255,255,255,.85);color:#29243b;
}
textarea{resize:vertical;min-height:80px}
.small{font-size:13px;opacity:.75}
.task{
display:flex;gap:8px;align-items:center;
padding:9px 0;border-bottom:1px solid rgba(120,100,150,.15);
}
.task span{flex:1;overflow-wrap:anywhere}
.task button{padding:6px 10px}
.progress{
height:10px;background:rgba(130,110,170,.2);
border-radius:20px;overflow:hidden;margin:12px 0;
}
.progress div{height:100%;width:0;background:#8b70dc;transition:.3s}
#clock{font-size:60px;font-weight:800;text-align:center;
margin:12px 0;letter-spacing:2px}
.focusOverlay{
position:fixed;inset:0;z-index:999;
background:linear-gradient(135deg,#211c37,#332653,#24384b);
color:white;display:none;align-items:center;justify-content:center;
flex-direction:column;text-align:center;padding:20px;
}
.focusOverlay.show{display:flex}
.focusOverlay #focusClock{font-size:clamp(60px,12vw,120px);
font-weight:800}
.focusOverlay button{margin:7px}
.focusOverlay input{max-width:350px}
.wallpapers{display:flex;gap:9px;flex-wrap:wrap}
.wall{
width:60px;height:60px;border-radius:13px;cursor:pointer;
border:2px solid transparent;
}
.wall:hover{border-color:white}
.bottom{
position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
background:var(--glass);backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.3);
border-radius:20px;padding:10px 15px;
display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.1);
}
.bottom button{font-size:14px}
.hidden{display:none!important}
@media(max-width:900px){
.desktop{grid-template-columns:repeat(2,minmax(220px,1fr))}
.wide{grid-column:span 2}
}
@media(max-width:600px){
.desk{padding:15px 12px 110px}
.desktop{grid-template-columns:1fr}
.wide{grid-column:span 1}
.topbar{align-items:flex-start}
.bottom{width:94%;bottom:8px}
}
</style>
</head>

<body>
<div class="desk">
<div class="topbar">
<div>
<div class="brand">✦ Students Hub</div>
<div class="small">Your personal study desktop</div>
</div>
<div class="datebox" id="date"></div>
</div>

<div class="desktop" id="desktop">

<!-- FOCUS WIDGET -->
<div class="widget" draggable="true" id="w-focus">
<h3 class="draghead">🌙 Deep Focus</h3>
<div class="small">Ready for a focus session?</div>
<div id="clock">25:00</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button onclick="startTimer()">▶ Start</button>
<button onclick="pauseTimer()">⏸ Pause</button>
<button onclick="resetTimer()">↺ Reset</button>
<button onclick="openFocus()">⛶ Fullscreen</button>
</div>
</div>

<!-- QUICK NOTES -->
<div class="widget" draggable="true" id="w-notes">
<h3 class="draghead">📝 Quick Notes</h3>
<textarea id="notes" placeholder="Write anything here..."></textarea>
<button onclick="saveNotes()">Save Notes</button>
<span class="small" id="notesStatus"></span>
</div>

<!-- PLANNER -->
<div class="widget" draggable="true" id="w-planner">
<h3 class="draghead">📋 Today's Tasks</h3>
<input id="taskInput" placeholder="Add a task...">
<button onclick="addTask()">+ Add task</button>
<div id="taskList"></div>
<div class="progress"><div id="taskProgress"></div></div>
<div class="small" id="taskCount"></div>
</div>

<!-- CHAPTER TRACKER -->
<div class="widget wide" draggable="true" id="w-chapters">
<h3 class="draghead">📚 Chapter Tracker</h3>
<select id="subject">
<option>Physics</option><option>Chemistry</option>
<option>Mathematics</option><option>English</option>
<option>Computer Science</option>
</select>
<input id="chapterInput" placeholder="Chapter name">
<button onclick="addChapter()">+ Add Chapter</button>
<div id="chapters"></div>
</div>

<!-- CUSTOMIZATION -->
<div class="widget" draggable="true" id="w-custom">
<h3 class="draghead">🎨 Customize Desk</h3>
<div class="small">Wallpaper</div>
<div class="wallpapers">
<div class="wall" style="background:linear-gradient(135deg,#e8ddff,#fbe4ef)" onclick="setWallpaper(0)"></div>
<div class="wall" style="background:linear-gradient(135deg,#b9e6ff,#c9f5df)" onclick="setWallpaper(1)"></div>
<div class="wall" style="background:linear-gradient(135deg,#ffc8df,#ffdfba)" onclick="setWallpaper(2)"></div>
<div class="wall" style="background:linear-gradient(135deg,#212136,#41305e)" onclick="setWallpaper(3)"></div>
<div class="wall" style="background:linear-gradient(135deg,#d5e7c8,#9cb8a0)" onclick="setWallpaper(4)"></div>
<div class="wall" style="background:linear-gradient(135deg,#b7c8f7,#e3c6ed)" onclick="setWallpaper(5)"></div>
</div>
<hr style="opacity:.2;margin:15px 0">
<label class="small">Accent Colour</label>
<input type="color" id="accentPicker" value="#c7b5ff" onchange="setAccent(this.value)">
<button onclick="toggleDark()" style="margin-top:10px">🌗 Toggle Dark Mode</button>
</div>

<!-- PROGRESS -->
<div class="widget" draggable="true" id="w-progress">
<h3 class="draghead">📊 My Progress</h3>
<div id="progressStats">Loading...</div>
<div class="progress"><div id="chapterProgress"></div></div>
<div class="small" id="chapterStats"></div>
</div>

<!-- WIDGET SETTINGS -->
<div class="widget" draggable="true" id="w-settings">
<h3 class="draghead">🖥️ Desktop Settings</h3>
<div class="small">Hide/show widgets</div>
<div id="widgetToggles"></div>
<hr style="opacity:.2">
<button onclick="resetDesk()">↺ Reset Desktop Layout</button>
</div>

</div>
</div>

<!-- FOCUS FULLSCREEN -->
<div class="focusOverlay" id="focusOverlay">
<div style="font-size:25px">🌙 DEEP FOCUS</div>
<input id="focusTask" placeholder="What are you focusing on?">
<div id="focusClock">25:00</div>
<div class="small" style="color:white">One task. One session. Your pace.</div>
<div>
<button onclick="startTimer()">▶ Start</button>
<button onclick="pauseTimer()">⏸ Pause</button>
<button onclick="resetTimer()">↺ Reset</button>
<button onclick="closeFocus()">✕ Exit Focus</button>
</div>
</div>

<div class="bottom">
<button onclick="openFocus()">🌙 Focus</button>
<button onclick="document.getElementById('w-planner').scrollIntoView({behavior:'smooth'})">📋 Tasks</button>
<button onclick="document.getElementById('w-chapters').scrollIntoView({behavior:'smooth'})">📚 Chapters</button>
<button onclick="document.getElementById('w-custom').scrollIntoView({behavior:'smooth'})">🎨 Desk</button>
</div>

<script>
const $=id=>document.getElementById(id);
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

$("date").textContent=new Date().toLocaleDateString(undefined,{
weekday:"long",day:"numeric",month:"long",year:"numeric"
});

let seconds=25*60, interval=null, running=false;

function displayTimer(){
let m=Math.floor(seconds/60),s=seconds%60;
let val=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
$("clock").textContent=val;
$("focusClock").textContent=val;
}
function startTimer(){
if(running)return;
running=true;
interval=setInterval(()=>{
if(seconds>0){seconds--;displayTimer()}
else{
pauseTimer();
alert("Focus session complete! Take a moment to rest.");
}
},1000);
}
function pauseTimer(){clearInterval(interval);interval=null;running=false}
function resetTimer(){pauseTimer();seconds=25*60;displayTimer()}
function openFocus(){$("focusOverlay").classList.add("show")}
function closeFocus(){$("focusOverlay").classList.remove("show")}
displayTimer();

let savedNotes=get("sh_notes","");
$("notes").value=savedNotes;
function saveNotes(){
put("sh_notes",$("notes").value);
$("notesStatus").textContent=" ✓ Saved";
}
$("notes").addEventListener("input",()=>{
put("sh_notes",$("notes").value);
$("notesStatus").textContent=" ✓ Autosaved";
});

let tasks=get("sh_tasks",[]);
function renderTasks(){
$("taskList").innerHTML="";
tasks.forEach((t,i)=>{
let div=document.createElement("div");
div.className="task";
let cb=document.createElement("input");
cb.type="checkbox";cb.style.width="auto";cb.checked=t.done;
cb.onchange=()=>{tasks[i].done=cb.checked;put("sh_tasks",tasks);renderTasks()};
let span=document.createElement("span");
span.textContent=t.text;
if(t.done)span.style.textDecoration="line-through";
let del=document.createElement("button");
del.textContent="×";
del.onclick=()=>{tasks.splice(i,1);put("sh_tasks",tasks);renderTasks()};
div.append(cb,span,del);
$("taskList").append(div);
});
let done=tasks.filter(t=>t.done).length;
$("taskProgress").style.width=(tasks.length?done/tasks.length*100:0)+"%";
$("taskCount").textContent=done+" / "+tasks.length+" tasks completed";
}
function addTask(){
let v=$("taskInput").value.trim();
if(!v)return;
tasks.push({text:v,done:false});
put("sh_tasks",tasks);
$("taskInput").value="";
renderTasks();
}
$("taskInput").addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});
renderTasks();

let chapters=get("sh_chapters",[]);
function renderChapters(){
$("chapters").innerHTML="";
chapters.forEach((c,i)=>{
let div=document.createElement("div");
div.className="task";
let span=document.createElement("span");
span.textContent=c.subject+" — "+c.name;
let select=document.createElement("select");
select.style.width="150px";
["Not Started","In Progress","Completed"].forEach(s=>{
let o=document.createElement("option");
o.textContent=s;o.value=s;o.selected=c.status===s;
select.append(o);
});
select.onchange=()=>{chapters[i].status=select.value;put("sh_chapters",chapters);renderChapters();renderStats()};
let del=document.createElement("button");
del.textContent="×";
del.onclick=()=>{chapters.splice(i,1);put("sh_chapters",chapters);renderChapters();renderStats()};
div.append(span,select,del);
$("chapters").append(div);
});
renderStats();
}
function addChapter(){
let name=$("chapterInput").value.trim();
if(!name)return;
chapters.push({subject:$("subject").value,name,status:"Not Started"});
put("sh_chapters",chapters);
$("chapterInput").value="";
renderChapters();
}
function renderStats(){
let total=chapters.length,done=chapters.filter(c=>c.status==="Completed").length;
$("chapterProgress").style.width=(total?done/total*100:0)+"%";
$("chapterStats").textContent=done+" of "+total+" chapters completed";
$("progressStats").textContent=total?Math.round(done/total*100)+"% chapter completion":"Add chapters to begin";
}
renderChapters();

const wallpapers=[
"linear-gradient(135deg,#e8ddff,#d8edff,#fbe4ef)",
"linear-gradient(135deg,#b9e6ff,#c9f5df)",
"linear-gradient(135deg,#ffc8df,#ffdfba)",
"linear-gradient(135deg,#212136,#41305e)",
"linear-gradient(135deg,#d5e7c8,#9cb8a0)",
"linear-gradient(135deg,#b7c8f7,#e3c6ed)"
];
function setWallpaper(i){
document.body.style.background=wallpapers[i];
put("sh_wall",i);
}
let wall=get("sh_wall",0);
setWallpaper(wall);

function setAccent(v){
document.documentElement.style.setProperty("--accent",v);
put("sh_accent",v);
}
$("accentPicker").value=get("sh_accent","#c7b5ff");
setAccent($("accentPicker").value);

function toggleDark(){
document.body.classList.toggle("dark");
put("sh_dark",document.body.classList.contains("dark"));
}
if(get("sh_dark",false))document.body.classList.add("dark");

let hiddenWidgets=get("sh_hidden",[]);
function renderToggles(){
$("widgetToggles").innerHTML="";
document.querySelectorAll(".desktop .widget").forEach(w=>{
let label=document.createElement("label");
label.className="task";
let cb=document.createElement("input");
cb.type="checkbox";cb.style.width="auto";
cb.checked=!hiddenWidgets.includes(w.id);
cb.onchange=()=>{
if(cb.checked)hiddenWidgets=hiddenWidgets.filter(x=>x!==w.id);
else hiddenWidgets.push(w.id);
put("sh_hidden",hiddenWidgets);
applyHidden();
};
label.append(cb,document.createTextNode(w.id.replace("w-","").replace(/-/g," ")));
$("widgetToggles").append(label);
});
}
function applyHidden(){
document.querySelectorAll(".desktop .widget").forEach(w=>{
w.classList.toggle("hidden",hiddenWidgets.includes(w.id));
});
}
renderToggles();applyHidden();

let order=get("sh_order",[]);
function applyOrder(){
order.forEach(id=>{
let el=$(id);
if(el) $("desktop").append(el);
});
}
applyOrder();

function resetDesk(){
if(!confirm("Reset widget order and visibility?"))return;
localStorage.removeItem("sh_order");
localStorage.removeItem("sh_hidden");
location.reload();
}

let dragged=null;
document.querySelectorAll(".desktop .widget").forEach(w=>{
w.addEventListener("dragstart",e=>{
dragged=w;
w.classList.add("dragging");
e.dataTransfer.setData("text/plain",w.id);
});
w.addEventListener("dragend",()=>{
w.classList.remove("dragging");
dragged=null;
});
w.addEventListener("dragover",e=>e.preventDefault());
w.addEventListener("drop",e=>{
e.preventDefault();
if(!dragged||dragged===w)return;
let all=[...$("desktop").children];
let a=all.indexOf(dragged),b=all.indexOf(w);
if(a<b)w.after(dragged);else w.before(dragged);
order=[...$("desktop").children].map(x=>x.id);
put("sh_order",order);
});
});

</script>
</body>
</html>
