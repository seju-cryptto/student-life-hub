<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Life Hub</title>
<style>
*{box-sizing:border-box}
:root{--accent:#9875df;--bg:#f2edff;--text:#443665;--glass:rgba(255,255,255,.88)}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--text);overflow:hidden}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--accent);color:white;transition:.2s}
button:hover{filter:brightness(.96);transform:translateY(-1px)}
button.secondary{background:#eee7ff;color:var(--text)}
button.danger{background:#ffebee;color:#b33950}
input,textarea,select{padding:11px;border:1px solid #ddd3f6;border-radius:12px;width:100%;outline:none;background:white;color:#443665}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
h1,h2,h3{margin-top:0}
.small{font-size:12px;opacity:.7}
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#bca4f4,#e8dfff,#a9c5f8);display:flex;align-items:center;justify-content:center;text-align:center}
.lockbox{background:rgba(255,255,255,.7);backdrop-filter:blur(20px);padding:40px;border-radius:30px;width:min(450px,90%);box-shadow:0 20px 80px #7560a533}
#clock{font-size:65px;font-weight:700;margin-bottom:0}
#date{margin:8px 0 25px}
#desktop{position:fixed;inset:0;display:none;background:linear-gradient(135deg,#e9ddff,#d5e7ff,#f6e5ff);background-size:cover}
#desktop:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#ffffff88,transparent 35%),radial-gradient(circle at 80% 80%,#c9b1ff77,transparent 45%);pointer-events:none}
.icons{position:absolute;top:15px;left:15px;display:flex;flex-direction:column;gap:8px;width:90px}
.desktop-icon{background:transparent;color:var(--text);padding:10px 5px;border-radius:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;word-break:break-word}
.desktop-icon:hover{background:#ffffff77}
.desktop-icon span:first-child{font-size:30px}
#widget{position:absolute;right:22px;top:20px;background:#ffffffaa;backdrop-filter:blur(10px);padding:20px;border-radius:20px;width:220px}
#widget h2{margin-bottom:8px}
#taskbar{position:absolute;bottom:0;left:0;right:0;height:58px;background:#ffffffb8;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 15px;z-index:80}
#taskleft,#taskright{display:flex;align-items:center;gap:8px}
#startbtn{font-size:18px;background:#e9ddff;color:var(--text)}
#taskapps{display:flex;gap:5px;overflow:auto}
.taskapp{background:#ffffff88;color:var(--text);padding:8px 12px;border-radius:10px;white-space:nowrap}
#startmenu{position:absolute;bottom:65px;left:15px;width:310px;background:#ffffffee;backdrop-filter:blur(20px);border-radius:22px;padding:18px;z-index:90;display:none;box-shadow:0 15px 50px #6a538533}
#startmenu.show{display:block}
#startapps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}
.startapp{background:#f2edff;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:6px;padding:15px 5px}
#search{margin-bottom:10px}
.window{position:absolute;width:min(650px,90vw);height:min(540px,75vh);background:var(--glass);backdrop-filter:blur(25px);border:1px solid #ffffffb0;border-radius:20px;box-shadow:0 20px 60px #64558c35;display:flex;flex-direction:column;overflow:hidden;z-index:10}
.window.maximized{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 74px)!important}
.wtitle{height:45px;min-height:45px;background:#ffffff80;display:flex;align-items:center;justify-content:space-between;padding:0 14px;cursor:move;user-select:none}
.wcontrols{display:flex;gap:6px}
.wcontrols button{padding:5px 10px;background:#eee7ff;color:var(--text)}
.wcontrols .close{background:#ffe4e9;color:#9f334b}
.wbody{padding:18px;overflow:auto;flex:1}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row>*{flex:1}
.card{background:white;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 3px 15px #6b538c0a}
.pill{display:inline-block;background:#eee7ff;border-radius:20px;padding:5px 10px;font-size:12px}
.progress{height:12px;background:#eee5fa;border-radius:20px;overflow:hidden}
.progress div{height:100%;background:var(--accent);width:0}
.item{background:#fff;padding:12px;border-radius:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item button{padding:7px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#toast{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);background:#443665;color:white;padding:12px 20px;border-radius:20px;z-index:120;display:none}
@media(max-width:650px){
.icons{display:grid;grid-template-columns:repeat(3,75px);width:auto}
#widget{top:150px;right:10px;width:180px}
.window{width:94vw!important;left:3vw!important}
.grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- WELCOME / LOCK SCREEN -->
<div id="lock">
  <div class="lockbox">
    <div style="font-size:60px">🎓</div>
    <p class="small">STUDENT LIFE HUB</p>
    <div id="clock">00:00</div>
    <div id="date"></div>
    <h2>Welcome to your Study Space 💜</h2>
    <p>Learn. Grow. Achieve.</p>
    <button onclick="enterDesktop()" style="width:100%;font-size:17px;padding:15px">✨ Enter Desktop</button>
    <p class="small" style="margin-top:20px">Your personal learning universe</p>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop">
  <div class="icons" id="icons"></div>

  <div id="widget">
    <h2>☁️ My Space</h2>
    <div id="wdate"></div>
    <hr style="border:0;border-top:1px solid #ddd">
    <p id="quote">Small steps every day.</p>
    <div class="pill">🎓 Study Edition</div>
  </div>

  <div id="startmenu">
    <h3>🎓 Student Life Hub</h3>
    <input id="search" placeholder="🔍 Search apps..." oninput="searchApps(this.value)">
    <div id="startapps"></div>
    <button class="secondary" style="width:100%;margin-top:15px" onclick="lockDesktop()">🔒 Lock Screen</button>
  </div>

  <div id="taskbar">
    <div id="taskleft">
      <button id="startbtn" onclick="toggleStart()">🎓</button>
      <div id="taskapps"></div>
    </div>
    <div id="taskright">
      <span id="taskclock"></span>
      <button class="secondary" onclick="lockDesktop()">🔒</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const apps=[
 {id:"home",name:"Home",icon:"🏠"},
 {id:"chapters",name:"Chapter Tracker",icon:"📚"},
 {id:"flash",name:"Flashcards",icon:"🃏"},
 {id:"mistakes",name:"Mistake Bank",icon:"❌"},
 {id:"revision",name:"Revision",icon:"🔁"},
 {id:"practice",name:"Practice",icon:"🧪"},
 {id:"exam",name:"Exam Simulator",icon:"📝"},
 {id:"notes",name:"Notes",icon:"📒"},
 {id:"calculator",name:"Calculator",icon:"🧮"},
 {id:"settings",name:"Settings",icon:"⚙️"}
];
let z=20, windows={}, activeQuiz=null, examTimer=null;
const store={
 chapters:JSON.parse(localStorage.getItem("hub_ch")||"[]"),
 flash:JSON.parse(localStorage.getItem("hub_fc")||"[]"),
 mistakes:JSON.parse(localStorage.getItem("hub_mi")||"[]"),
 revisions:JSON.parse(localStorage.getItem("hub_re")||"[]"),
 questions:JSON.parse(localStorage.getItem("hub_q")||"[]"),
 notes:localStorage.getItem("hub_notes")||""
};
function save(){
 for(let k of ["chapters","flash","mistakes","revisions","questions"])
 localStorage.setItem("hub_"+({chapters:"ch",flash:"fc",mistakes:"mi",revisions:"re",questions:"q"}[k]),JSON.stringify(store[k]));
 localStorage.setItem("hub_notes",store.notes);
}
function updateClock(){
 const d=new Date();
 document.getElementById("clock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
 document.getElementById("date").textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",year:"numeric"});
 document.getElementById("taskclock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
 document.getElementById("wdate").textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});
}
setInterval(updateClock,1000);updateClock();

function enterDesktop(){
 document.getElementById("lock").style.display="none";
 document.getElementById("desktop").style.display="block";
}
function lockDesktop(){
 document.getElementById("desktop").style.display="none";
 document.getElementById("lock").style.display="flex";
 document.getElementById("startmenu").classList.remove("show");
}
function toggleStart(){document.getElementById("startmenu").classList.toggle("show")}
function buildIcons(){
 const ic=document.getElementById("icons"),st=document.getElementById("startapps");
 ic.innerHTML="";st.innerHTML="";
 apps.forEach(a=>{
  let b=document.createElement("button");b.className="desktop-icon";
  b.innerHTML=`<span>${a.icon}</span><span>${a.name}</span>`;
  b.onclick=()=>openApp(a.id);ic.appendChild(b);
  let s=document.createElement("button");s.className="startapp";
  s.innerHTML=`<span style="font-size:26px">${a.icon}</span><span>${a.name}</span>`;
  s.onclick=()=>{openApp(a.id);toggleStartIfOpen()};st.appendChild(s);
 });
}
buildIcons();
function toggleStartIfOpen(){document.getElementById("startmenu").classList.remove("show")}
function searchApps(q){
 document.querySelectorAll("#startapps .startapp").forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q.toLowerCase())?"flex":"none");
}
function toast(msg){
 let t=document.getElementById("toast");t.textContent=msg;t.style.display="block";
 setTimeout(()=>t.style.display="none",2200);
}
function openApp(id){
 if(windows[id]){windows[id].style.display="flex";windows[id].style.zIndex=++z;return}
 const a=apps.find(x=>x.id===id);
 const w=document.createElement("div");w.className="window";w.style.zIndex=++z;
 w.style.left=(100+Math.random()*180)+"px";w.style.top=(70+Math.random()*100)+"px";
 w.innerHTML=`<div class="wtitle"><span>${a.icon} ${a.name}</span><div class="wcontrols"><button onclick="minimize('${id}')">—</button><button onclick="maximize('${id}')">□</button><button class="close" onclick="closeApp('${id}')">✕</button></div></div><div class="wbody" id="body_${id}"></div>`;
 document.getElementById("desktop").appendChild(w);windows[id]=w;
 w.addEventListener("mousedown",()=>w.style.zIndex=++z);
 drag(w,w.querySelector(".wtitle"));
 renderApp(id);
 updateTaskApps();
}
function drag(w,h){
 h.addEventListener("mousedown",e=>{
  if(e.target.closest("button"))return;
  if(w.classList.contains("maximized"))return;
  let sx=e.clientX,sy=e.clientY,ox=w.offsetLeft,oy=w.offsetTop;
  document.onmousemove=ev=>{w.style.left=ox+ev.clientX-sx+"px";w.style.top=oy+ev.clientY-sy+"px"};
  document.onmouseup=()=>{document.onmousemove=null;document.onmouseup=null};
 });
}
function minimize(id){if(windows[id])windows[id].style.display="none";updateTaskApps()}
function maximize(id){if(windows[id])windows[id].classList.toggle("maximized")}
function closeApp(id){if(windows[id]){windows[id].remove();delete windows[id]}updateTaskApps()}
function updateTaskApps(){
 let t=document.getElementById("taskapps");t.innerHTML="";
 Object.keys(windows).forEach(id=>{
 let b=document.createElement("button");b.className="taskapp";b.textContent=apps.find(a=>a.id===id).icon;
 b.title=apps.find(a=>a.id===id).name;
 b.onclick=()=>{windows[id].style.display="flex";windows[id].style.zIndex=++z};
 t.appendChild(b);
 });
}
function renderApp(id){
 let b=document.getElementById("body_"+id);if(!b)return;
 if(id==="home")b.innerHTML=homeHTML();
 if(id==="chapters")b.innerHTML=chaptersHTML();
 if(id==="flash")b.innerHTML=flashHTML();
 if(id==="mistakes")b.innerHTML=mistakesHTML();
 if(id==="revision")b.innerHTML=revisionHTML();
 if(id==="practice")b.innerHTML=practiceHTML();
 if(id==="exam")b.innerHTML=examHTML();
 if(id==="notes")b.innerHTML=notesHTML();
 if(id==="calculator")b.innerHTML=calcHTML();
 if(id==="settings")b.innerHTML=settingsHTML();
}
function homeHTML(){
 let total=store.chapters.length,master=store.chapters.filter(x=>x.status==="Mastered").length;
 let due=store.revisions.filter(x=>x.date<=today()).length;
 let pct=total?Math.round(master/total*100):0;
 return `<h2>Welcome to your Study Desktop 💜</h2><p>Make today count, one chapter at a time.</p>
 <div class="grid2"><div class="card"><h3>📚 Chapters</h3><h2>${total}</h2></div><div class="card"><h3>🏆 Mastered</h3><h2>${master}</h2></div><div class="card"><h3>🔁 Due</h3><h2>${due}</h2></div><div class="card"><h3>🃏 Flashcards</h3><h2>${store.flash.length}</h2></div></div>
 <div class="card"><h3>Progress</h3><div class="progress"><div style="width:${pct}%"></div></div><p>${pct}% chapters mastered</p></div>
 <h3>Quick Launch</h3><div class="grid2">${apps.slice(1,7).map(a=>`<button class="secondary" onclick="openApp('${a.id}')">${a.icon} ${a.name}</button>`).join("")}</div>`;
}
function chaptersHTML(){
 return `<h2>📚 Chapter Tracker</h2><div class="row"><select id="chsub">${subjects()}</select><input id="chname" placeholder="Chapter name"></div><button onclick="addChapter()">+ Add Chapter</button><hr><div id="chlist">${store.chapters.map((c,i)=>chapterItem(c,i)).join("")||"No chapters yet."}</div>`;
}
const subs=["Physics","Chemistry","Maths","English","Computer Science"];
function subjects(){return subs.map(s=>`<option>${s}</option>`).join("")}
function chapterItem(c,i){return `<div class="item"><div><b>${c.subject}</b><br>${c.name}<br><span class="pill">${c.status}</span></div><div><select onchange="statusChapter(${i},this.value)"><option ${c.status==="Learning"?"selected":""}>Learning</option><option ${c.status==="Practising"?"selected":""}>Practising</option><option ${c.status==="Revised"?"selected":""}>Revised</option><option ${c.status==="Mastered"?"selected":""}>Mastered</option></select><button class="danger" onclick="delChapter(${i})">✕</button></div></div>`}
function addChapter(){
 let n=document.getElementById("chname").value.trim(),s=document.getElementById("chsub").value;
 if(!n)return toast("Enter chapter name!");
 store.chapters.push({subject:s,name:n,status:"Learning"});save();renderApp("chapters");refresh("home");toast("Chapter added!");
}
function statusChapter(i,v){store.chapters[i].status=v;save();renderApp("chapters");refresh("home")}
function delChapter(i){store.chapters.splice(i,1);save();renderApp("chapters");refresh("home")}
function refresh(id){if(windows[id])renderApp(id)}
function flashHTML(){return `<h2>🃏 Flashcards</h2><div class="row"><select id="fcsub">${subjects()}</select><input id="fcq" placeholder="Question"></div><textarea id="fca" placeholder="Answer" rows="3"></textarea><button onclick="addFlash()">+ Save Card</button><hr>${store.flash.map((f,i)=>`<div class="card"><b>${f.subject}</b><p>${f.q}</p><button class="secondary" onclick="revealFC(${i})">Reveal Answer</button><div id="ans${i}" style="display:none;margin-top:10px">${f.a}</div><button class="danger" onclick="delFC(${i})">Delete</button></div>`).join("")||"No flashcards yet."}`}
function addFlash(){let q=document.getElementById("fcq").value.trim(),a=document.getElementById("fca").value.trim();if(!q||!a)return toast("Fill both fields");store.flash.push({subject:document.getElementById("fcsub").value,q,a});save();renderApp("flash")}
function revealFC(i){let e=document.getElementById("ans"+i);e.style.display=e.style.display==="none"?"block":"none"}
function delFC(i){store.flash.splice(i,1);save();renderApp("flash")}
function mistakesHTML(){return `<h2>❌ Mistake Bank</h2><div class="row"><select id="misub">${subjects()}</select><input id="miq" placeholder="Question/topic"></div><textarea id="mireason" placeholder="What went wrong?"></textarea><textarea id="micorrect" placeholder="Correct concept / solution"></textarea><button onclick="addMistake()">+ Save Mistake</button><hr>${store.mistakes.map((m,i)=>`<div class="card"><b>${m.subject} · ${m.q}</b><p><b>Reason:</b> ${m.reason}</p><p><b>Correction:</b> ${m.correct}</p><button class="secondary" onclick="addRevFromMistake(${i})">🔁 Revise</button><button class="danger" onclick="delMistake(${i})">Delete</button></div>`).join("")||"No mistakes saved."}`}
function addMistake(){let q=document.getElementById("miq").value.trim(),r=document.getElementById("mireason").value.trim(),c=document.getElementById("micorrect").value.trim();if(!q)return toast("Enter a question");store.mistakes.push({subject:document.getElementById("misub").value,q,reason:r,correct:c});save();renderApp("mistakes")}
function delMistake(i){store.mistakes.splice(i,1);save();renderApp("mistakes")}
function addRevFromMistake(i){store.revisions.push({subject:store.mistakes[i].subject,name:store.mistakes[i].q,date:today()});save();renderApp("revision");toast("Added to revision!")}
function today(){return new Date().toISOString().slice(0,10)}
function revisionHTML(){return `<h2>🔁 Revision Planner</h2><div class="row"><select id="resub">${subjects()}</select><input id="rename" placeholder="Topic"></div><div class="row"><input id="redate" type="date" value="${today()}"></div><button onclick="addRevision()">+ Schedule</button><hr>${store.revisions.map((r,i)=>`<div class="item"><div><b>${r.subject}</b><br>${r.name}<br><span class="pill">${r.date}</span></div><div><button onclick="doneRev(${i})">✓ Done</button><button class="danger" onclick="delRev(${i})">✕</button></div></div>`).join("")||"Nothing scheduled."}`}
function addRevision(){let n=document.getElementById("rename").value.trim();if(!n)return toast("Enter topic");store.revisions.push({subject:document.getElementById("resub").value,name:n,date:document.getElementById("redate").value||today()});save();renderApp("revision");refresh("home")}
function doneRev(i){store.revisions.splice(i,1);save();renderApp("revision");refresh("home")}
function delRev(i){doneRev(i)}
function practiceHTML(){return `<h2>🧪 Practice Arena</h2><div class="row"><select id="qsub">${subjects()}</select><input id="qq" placeholder="Question"></div><div class="row"><input id="o0" placeholder="Option A"><input id="o1" placeholder="Option B"></div><div class="row"><input id="o2" placeholder="Option C"><input id="o3" placeholder="Option D"></div><select id="correct"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><button onclick="addQuestion()">+ Add MCQ</button><hr><p>${store.questions.length} questions saved</p><button onclick="runPractice()">▶ Start Practice</button><div id="quiz"></div><hr>${store.questions.map((q,i)=>`<div class="item"><span>${q.subject}: ${q.q}</span><button class="danger" onclick="delQ(${i})">✕</button></div>`).join("")}`}
function addQuestion(){let q=document.getElementById("qq").value.trim(),o=[0,1,2,3].map(i=>document.getElementById("o"+i).value.trim());if(!q||o.some(x=>!x))return toast("Fill question and all options");store.questions.push({subject:document.getElementById("qsub").value,q,o,c:+document.getElementById("correct").value});save();renderApp("practice");toast("MCQ saved!")}
function delQ(i){store.questions.splice(i,1);save();renderApp("practice")}
function runPractice(){let qs=[...store.questions];if(!qs.length)return toast("Add MCQs first!");let score=0,i=0,el=document.getElementById("quiz");function draw(){if(i>=qs.length){el.innerHTML=`<div class="card"><h2>Quiz Finished 🎉</h2><p>Score: ${score}/${qs.length}</p></div>`;return}let q=qs[i];el.innerHTML=`<div class="card"><h3>${i+1}/${qs.length}: ${q.q}</h3>${q.o.map((o,j)=>`<button class="secondary" style="display:block;width:100%;margin:5px 0;text-align:left" onclick="pick(${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}</div>`}window.pick=j=>{if(j===qs[i].c)score++;else store.mistakes.push({subject:qs[i].subject,q:qs[i].q,reason:"Practice mistake",correct:qs[i].o[qs[i].c]});i++;save();draw()};draw()}
function examHTML(){return `<h2>📝 Exam Simulator</h2><p>Create MCQs in Practice first. Exam is a timed run through saved questions.</p><div class="row"><label>Time per question (seconds)<input id="examtime" type="number" value="30" min="5"></label></div><button onclick="startExam()">🚀 Start Exam</button><div id="examarea"></div>`}
function startExam(){
 if(!store.questions.length)return toast("Add MCQs in Practice first!");
 let qs=[...store.questions],i=0,score=0,seconds=+(document.getElementById("examtime")?.value||30),remaining=seconds,el=document.getElementById("examarea");
 if(examTimer)clearInterval(examTimer);
 function finish(){clearInterval(examTimer);examTimer=null;el.innerHTML=`<div class="card"><h2>Exam completed 🎉</h2><p>Score: ${score}/${qs.length}</p><p>Accuracy: ${Math.round(score/qs.length*100)}%</p><button onclick="startExam()">Try again</button></div>`}
 function draw(){if(i>=qs.length){finish();return}let q=qs[i];el.innerHTML=`<div class="card"><h3>Question ${i+1}/${qs.length}</h3><p>⏳ ${remaining}s</p><h3>${q.q}</h3>${q.o.map((o,j)=>`<button class="secondary" style="display:block;width:100%;margin:5px 0;text-align:left" onclick="examPick(${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}</div>`}
 window.examPick=j=>{if(j===qs[i].c)score++;else store.mistakes.push({subject:qs[i].subject,q:qs[i].q,reason:"Exam error",correct:qs[i].o[qs[i].c]});i++;remaining=seconds;save();draw()};
 examTimer=setInterval(()=>{remaining--;if(remaining<=0){i++;remaining=seconds;if(i>=qs.length)finish();else draw()}else draw()},1000);draw();
}
function notesHTML(){return `<h2>📒 Notes</h2><textarea id="notearea" rows="15" placeholder="Write your study notes here...">${store.notes}</textarea><button onclick="saveNotes()">💾 Save Notes</button>`}
function saveNotes(){store.notes=document.getElementById("notearea").value;save();toast("Notes saved!")}
function calcHTML(){return `<h2>🧮 Calculator</h2><input id="calin" placeholder="Example: (12+8)*5" ><button onclick="calculate()">Calculate</button><div class="card" id="calout">Result</div><p class="small">Basic arithmetic only.</p>`}
function calculate(){try{let s=document.getElementById("calin").value;if(!/^[0-9+\\-*/().%\\s]+$/.test(s))throw 1;let result=Function('"use strict";return ('+s+')')();document.getElementById("calout").textContent=result}catch(e){document.getElementById("calout").textContent="Invalid expression"}}
function settingsHTML(){return `<h2>⚙️ Settings</h2><h3>Accent Colour</h3><input type="color" id="colour" value="#9875df" onchange="changeColor(this.value)"><h3>Wallpaper</h3><select onchange="wall(this.value)"><option value="1">Lavender</option><option value="2">Blue</option><option value="3">Peach</option><option value="4">Mint</option></select><hr><button class="secondary" onclick="lockDesktop()">🔒 Lock screen</button><button class="danger" onclick="clearAll()">Reset all study data</button><p class="small">Reset permanently clears this website's locally saved study data.</p>`}
function changeColor(v){document.documentElement.style.setProperty("--accent",v)}
function wall(v){let b=document.getElementById("desktop");let styles={1:"linear-gradient(135deg,#e9ddff,#d5e7ff,#f6e5ff)",2:"linear-gradient(135deg,#cde8ff,#e4f1ff,#d8d9ff)",3:"linear-gradient(135deg,#ffe4d8,#fff1e7,#ffdce8)",4:"linear-gradient(135deg,#d7f5e9,#e7fff2,#d3edff)"};b.style.background=styles[v]}
function clearAll(){if(confirm("Delete ALL saved study data?")){Object.keys(store).forEach(k=>store[k]=k==="notes"?"":[]);save();Object.keys(windows).forEach(closeApp);toast("Study data reset.")}}
</script>
