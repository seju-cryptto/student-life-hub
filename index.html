<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student OS 💜</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial;color:#32264a}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px;background:#8b70d5;color:white}
button:hover{filter:brightness(.94)}
input,select,textarea{padding:10px;border:1px solid #ddd;border-radius:10px;width:100%;margin:5px 0}
.screen{position:fixed;inset:0}
.hidden{display:none!important}
#lock{
 background:linear-gradient(140deg,#d8c9ff,#f6eaff,#b9c8ff);
 display:flex;align-items:center;justify-content:center;text-align:center
}
.lockbox{background:#ffffffb9;padding:40px;border-radius:25px;width:min(420px,90%)}
#clock{font-size:60px;font-weight:700}
#desktop{
 background:linear-gradient(135deg,#d8c7ff,#f5e9ff,#b5c9ff);
 overflow:hidden
}
.icons{display:grid;grid-template-columns:90px;gap:10px;padding:20px}
.icon{padding:14px;text-align:center;color:#38294f;cursor:pointer;border-radius:15px}
.icon:hover{background:#ffffff70}
.icon span{font-size:34px;display:block;margin-bottom:5px}
#taskbar{
 position:absolute;bottom:0;width:100%;height:55px;
 background:#ffffffaa;backdrop-filter:blur(15px);
 display:flex;align-items:center;justify-content:space-between;padding:8px 15px
}
#startmenu{
 position:absolute;bottom:65px;left:10px;width:300px;
 background:#ffffffed;padding:20px;border-radius:20px;
 box-shadow:0 8px 30px #5553
}
.window{
 position:absolute;top:10%;left:20%;width:min(650px,90%);
 max-height:80%;overflow:auto;background:#fff;border-radius:18px;
 box-shadow:0 10px 40px #55447755
}
.winhead{
 background:#eee6ff;padding:12px;display:flex;
 justify-content:space-between;align-items:center;position:sticky;top:0
}
.winbody{padding:16px}
.close{background:#d75c83}
.card{background:#f8f5ff;padding:12px;border-radius:13px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.small{font-size:12px;color:#746887}
#toast{position:absolute;bottom:75px;right:20px;background:#483568;color:white;padding:12px;border-radius:12px}
</style>
</head>
<body>

<!-- WELCOME / LOCK SCREEN -->
<div id="lock" class="screen">
 <div class="lockbox">
  <div id="clock">00:00</div>
  <h2 id="date"></h2>
  <h1>Welcome to Student OS 💜</h1>
  <p>Your personal study desktop</p>
  <button onclick="enterDesktop()" style="font-size:18px;padding:15px 25px">
   Enter Desktop →
  </button>
 </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="screen hidden">
 <div class="icons">
  <div class="icon" onclick="openApp('chapters')"><span>📚</span>Chapters</div>
  <div class="icon" onclick="openApp('flash')"><span>🃏</span>Flashcards</div>
  <div class="icon" onclick="openApp('mistakes')"><span>❌</span>Mistakes</div>
  <div class="icon" onclick="openApp('revision')"><span>🔁</span>Revision</div>
  <div class="icon" onclick="openApp('practice')"><span>🧪</span>Practice</div>
  <div class="icon" onclick="openApp('exam')"><span>📝</span>Exam</div>
  <div class="icon" onclick="openApp('notes')"><span>📒</span>Notes</div>
  <div class="icon" onclick="openApp('settings')"><span>⚙️</span>Settings</div>
 </div>

 <div id="windows"></div>

 <div id="taskbar">
  <button onclick="toggleStart()">⊞ Start</button>
  <div id="running" class="row"></div>
  <div id="barclock">00:00</div>
 </div>

 <div id="startmenu" class="hidden">
  <h2>💜 Student OS</h2>
  <input id="search" placeholder="Search apps..." oninput="searchApps(this.value)">
  <div id="searchresults"></div>
  <hr>
  <button onclick="lockDesktop()">🔒 Lock Desktop</button>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const get=(k,d=[])=>{try{return JSON.parse(localStorage.getItem("os_"+k))||d}catch{return d}};
const save=(k,v)=>localStorage.setItem("os_"+k,JSON.stringify(v));

let chapters=get("chapters"),flash=get("flash"),mistakes=get("mistakes"),
revision=get("revision"),questions=get("questions"),notes=get("notes",{}),
opened={},z=10;

function clock(){
 let d=new Date();
 $("clock").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
 $("barclock").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
 $("date").textContent=d.toLocaleDateString([], {weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
clock();setInterval(clock,1000);

function enterDesktop(){
 $("lock").classList.add("hidden");
 $("desktop").classList.remove("hidden");
 toggleStart(false);
}

function lockDesktop(){
 $("desktop").classList.add("hidden");
 $("lock").classList.remove("hidden");
 $("startmenu").classList.add("hidden");
}

function toggleStart(force){
 if(force===false){$("startmenu").classList.add("hidden");return}
 $("startmenu").classList.toggle("hidden");
}

function searchApps(v){
 let apps={chapters:"📚 Chapters",flash:"🃏 Flashcards",mistakes:"❌ Mistakes",
 revision:"🔁 Revision",practice:"🧪 Practice",exam:"📝 Exam",notes:"📒 Notes",settings:"⚙️ Settings"};
 $("searchresults").innerHTML="";
 Object.entries(apps).filter(([k,n])=>n.toLowerCase().includes(v.toLowerCase()))
 .forEach(([k,n])=>{
  let b=document.createElement("button");b.textContent=n;b.style.margin="5px";
  b.onclick=()=>openApp(k);$("searchresults").appendChild(b);
 });
}

function openApp(name){
 $("startmenu").classList.add("hidden");
 if(opened[name]){opened[name].style.zIndex=++z;return}
 let titles={chapters:"Chapter Tracker",flash:"Flashcards",mistakes:"Mistake Bank",
 revision:"Revision Scheduler",practice:"Practice Arena",exam:"Exam Simulator",
 notes:"Study Notes",settings:"Desktop Settings"};
 let w=document.createElement("div");
 w.className="window";w.style.zIndex=++z;
 w.innerHTML=`<div class="winhead">
 <b>${titles[name]}</b>
 <div><button onclick="minApp('${name}')">−</button>
 <button class="close" onclick="closeApp('${name}')">×</button></div>
 </div><div class="winbody" id="body_${name}"></div>`;
 $("windows").appendChild(w);opened[name]=w;
 drag(w);
 render(name);
 updateRunning();
}

function closeApp(n){
 if(opened[n]){opened[n].remove();delete opened[n];updateRunning()}
}
function minApp(n){
 if(opened[n])opened[n].style.display="none";
 updateRunning();
}
function updateRunning(){
 $("running").innerHTML="";
 Object.keys(opened).forEach(n=>{
  let b=document.createElement("button");
  b.textContent=n;b.onclick=()=>{opened[n].style.display="block";opened[n].style.zIndex=++z};
  $("running").appendChild(b);
 });
}
function drag(w){
 let h=w.querySelector(".winhead"),ox,oy,m=false;
 h.onmousedown=e=>{
  if(e.target.tagName==="BUTTON")return;
  m=true;ox=e.clientX-w.offsetLeft;oy=e.clientY-w.offsetTop;w.style.zIndex=++z
 };
 document.onmousemove=e=>{
  if(!m)return;
  w.style.left=Math.max(0,e.clientX-ox)+"px";
  w.style.top=Math.max(0,e.clientY-oy)+"px";
 };
 document.onmouseup=()=>m=false;
}
function render(n){
 let b=$("body_"+n);
 if(n==="chapters")chapterUI(b);
 if(n==="flash")flashUI(b);
 if(n==="mistakes")mistakeUI(b);
 if(n==="revision")revisionUI(b);
 if(n==="practice")practiceUI(b);
 if(n==="exam")examUI(b);
 if(n==="notes")notesUI(b);
 if(n==="settings")settingsUI(b);
}

function chapterUI(b){
 b.innerHTML=`<div class="row">
 <select id="cs"><option>Physics</option><option>Chemistry</option><option>Maths</option><option>English</option><option>Computer Science</option></select>
 <input id="cn" placeholder="Chapter name"></div>
 <button onclick="addChapter()">+ Add Chapter</button>
 <div id="clist"></div>`;
 drawChapters();
}
function addChapter(){
 let s=$("cs").value,n=$("cn").value.trim();if(!n)return;
 chapters.push({s,n,status:"Learning"});save("chapters",chapters);$("cn").value="";drawChapters();
}
function drawChapters(){
 let el=$("clist");if(!el)return;
 el.innerHTML="";
 chapters.forEach((c,i)=>{
 let d=document.createElement("div");d.className="card";
 d.innerHTML=`<b>${c.s}</b> — ${c.n}<br>
 <select onchange="chapterStatus(${i},this.value)">
 <option ${c.status==="Learning"?"selected":""}>Learning</option>
 <option ${c.status==="Practising"?"selected":""}>Practising</option>
 <option ${c.status==="Revised"?"selected":""}>Revised</option>
 <option ${c.status==="Mastered"?"selected":""}>Mastered</option>
 </select><button class="close" onclick="delChapter(${i})">Delete</button>`;
 el.appendChild(d);
 });
}
function chapterStatus(i,v){chapters[i].status=v;save("chapters",chapters)}
function delChapter(i){chapters.splice(i,1);save("chapters",chapters);drawChapters()}

function flashUI(b){
 b.innerHTML=`<input id="fq" placeholder="Question">
 <textarea id="fa" placeholder="Answer"></textarea>
 <button onclick="addFlash()">Save Card</button><div id="flist"></div>`;
 drawFlash();
}
function addFlash(){
 if(!$("fq").value.trim()||!$("fa").value.trim())return;
 flash.push({q:$("fq").value,a:$("fa").value});
 save("flash",flash);$("fq").value="";$("fa").value="";drawFlash();
}
function drawFlash(){
 let e=$("flist");if(!e)return;e.innerHTML="";
 flash.forEach((f,i)=>{
 let d=document.createElement("div");d.className="card";
 d.innerHTML=`<b>${f.q}</b><br><button onclick="this.nextElementSibling.classList.toggle('hidden')">Reveal Answer</button>
 <p class="hidden">${f.a}</p><button class="close" onclick="delFlash(${i})">Delete</button>`;
 e.appendChild(d);
 });
}
function delFlash(i){flash.splice(i,1);save("flash",flash);drawFlash()}

function mistakeUI(b){
 b.innerHTML=`<input id="miq" placeholder="Question / Mistake">
 <input id="mic" placeholder="Chapter">
 <textarea id="mir" placeholder="Why was it wrong?"></textarea>
 <textarea id="mif" placeholder="Correct approach"></textarea>
 <button onclick="addMistake()">Save Mistake</button><div id="milist"></div>`;
 drawMistakes();
}
function addMistake(){
 if(!$("miq").value.trim())return;
 mistakes.push({q:$("miq").value,c:$("mic").value,r:$("mir").value,f:$("mif").value});
 save("mistakes",mistakes);
 ["miq","mic","mir","mif"].forEach(x=>$(x).value="");drawMistakes();
}
function drawMistakes(){
 let e=$("milist");if(!e)return;e.innerHTML="";
 mistakes.forEach((m,i)=>{
 let d=document.createElement("div");d.className="card";
 d.innerHTML=`<b>${m.q}</b><p>Chapter: ${m.c}</p><p>Reason: ${m.r}</p><p>Correction: ${m.f}</p>
 <button onclick="mistakeToRevision(${i})">Add Revision</button>
 <button class="close" onclick="delMistake(${i})">Delete</button>`;
 e.appendChild(d);
 });
}
function delMistake(i){mistakes.splice(i,1);save("mistakes",mistakes);drawMistakes()}
function mistakeToRevision(i){
 revision.push({t:mistakes[i].q,d:new Date().toISOString().slice(0,10),done:false});
 save("revision",revision);alert("Added to revision!");
}

function revisionUI(b){
 b.innerHTML=`<input id="rt" placeholder="Topic">
 <input id="rd" type="date">
 <button onclick="addRevision()">Schedule</button><div id="rlist"></div>`;
 drawRevision();
}
function addRevision(){
 if(!$("rt").value.trim())return;
 revision.push({t:$("rt").value,d:$("rd").value,done:false});
 save("revision",revision);$("rt").value="";drawRevision();
}
function drawRevision(){
 let e=$("rlist");if(!e)return;e.innerHTML="";
 revision.forEach((r,i)=>{
 let d=document.createElement("div");d.className="card";
 d.innerHTML=`<b>${r.t}</b> — ${r.d||"No date"} ${r.done?"✔️":""}
 <button onclick="revDone(${i})">Done</button>
 <button class="close" onclick="delRev(${i})">Delete</button>`;
 e.appendChild(d);
 });
}
function revDone(i){revision[i].done=true;save("revision",revision);drawRevision()}
function delRev(i){revision.splice(i,1);save("revision",revision);drawRevision()}

function practiceUI(b){
 b.innerHTML=`<select id="qs"><option>Physics</option><option>Chemistry</option><option>Maths</option><option>English</option><option>Computer Science</option></select>
 <input id="qq" placeholder="Question">
 <input id="q1" placeholder="Option A">
 <input id="q2" placeholder="Option B">
 <input id="q3" placeholder="Option C">
 <input id="q4" placeholder="Option D">
 <select id="qcorrect"><option>0</option><option>1</option><option>2</option><option>3</option></select>
 <p class="small">Correct option: 0=A, 1=B, 2=C, 3=D</p>
 <button onclick="addQuestion()">Add MCQ</button>
 <button onclick="runPractice()">Start Practice</button><div id="qlist"></div>`;
 drawQuestions();
}
function addQuestion(){
 if(!$("qq").value.trim())return;
 questions.push({s:$("qs").value,q:$("qq").value,
 o:[$("q1").value,$("q2").value,$("q3").value,$("q4").value],
 c:+$("qcorrect").value});
 save("questions",questions);
 ["qq","q1","q2","q3","q4"].forEach(x=>$(x).value="");drawQuestions();
}
function drawQuestions(){
 let e=$("qlist");if(!e)return;e.innerHTML="";
 questions.forEach((q,i)=>{
 let d=document.createElement("div");d.className="card";
 d.textContent=q.s+" — "+q.q;
 let x=document.createElement("button");x.textContent="Delete";x.className="close";x.onclick=()=>{questions.splice(i,1);save("questions",questions);drawQuestions()};
 d.appendChild(x);e.appendChild(d);
 });
}
function runPractice(){
 let pool=questions.slice();if(!pool.length){alert("Add questions first!");return}
 let score=0,i=0;
 let e=$("qlist");e.innerHTML="";
 function next(){
  if(i>=pool.length){e.innerHTML=`<h2>Score: ${score}/${pool.length}</h2>`;return}
  let q=pool[i];
  e.innerHTML=`<div class="card"><b>${i+1}. ${q.q}</b></div>`;
  q.o.forEach((o,j)=>{
   let b=document.createElement("button");b.style.display="block";b.style.margin="8px 0";b.textContent=o||("Option "+(j+1));
   b.onclick=()=>{
    if(j===q.c)score++;
    else mistakes.push({q:q.q,c:q.s,r:"Practice incorrect answer",f:q.o[q.c]});
    save("mistakes",mistakes);i++;next();
   };e.appendChild(b);
  });
 }
 next();
}

function examUI(b){
 b.innerHTML=`<p>Exam simulator uses saved MCQs.</p>
 <label>Duration (minutes)</label><input id="etime" type="number" value="10">
 <button onclick="runExam()">Start Exam</button><div id="examout"></div>`;
}
function runExam(){
 let pool=questions.slice();if(!pool.length){alert("Add MCQs in Practice first.");return}
 let duration=Math.max(1,+$("etime").value||10)*60;
 let e=$("examout"),score=0,i=0,finished=false;
 let timer;
 function finish(){
  if(finished)return;finished=true;clearInterval(timer);
  e.innerHTML=`<h2>Exam finished!</h2><p>Score: ${score}/${pool.length}</p><p>Accuracy: ${Math.round(score/pool.length*100)}%</p>`;
 }
 function draw(){
  if(finished)return;
  if(i>=pool.length){finish();return}
  let q=pool[i];e.innerHTML=`<p>Time left: ${duration}s</p><b>${i+1}/${pool.length} — ${q.q}</b>`;
  q.o.forEach((o,j)=>{
   let b=document.createElement("button");b.style.display="block";b.style.margin="8px";
   b.textContent=o||("Option "+(j+1));
   b.onclick=()=>{
    if(finished)return;
    if(j===q.c)score++;
    else{mistakes.push({q:q.q,c:q.s,r:"Exam incorrect answer",f:q.o[q.c]});save("mistakes",mistakes)}
    i++;draw();
   };e.appendChild(b);
  });
 }
 timer=setInterval(()=>{if(finished)return;duration--;if(duration<=0)finish();else draw()},1000);
 draw();
}

function notesUI(b){
 b.innerHTML=`<select id="ns"><option>Physics</option><option>Chemistry</option><option>Maths</option><option>English</option><option>Computer Science</option></select>
 <textarea id="nt" rows="12" placeholder="Your notes..."></textarea>
 <button onclick="saveNotes()">Save Notes</button>`;
 $("ns").onchange=loadNotes;$("nt").oninput=()=>saveNotes();
 loadNotes();
}
function loadNotes(){$("nt").value=notes[$("ns").value]||""}
function saveNotes(){notes[$("ns").value]=$("nt").value;save("notes",notes)}

function settingsUI(b){
 b.innerHTML=`<h3>Desktop Settings</h3>
 <button onclick="changeBg('#d8c7ff','#f5e9ff','#b5c9ff')">Lavender</button>
 <button onclick="changeBg('#d5f5e3','#f2fffa','#b3dfc7')">Mint</button>
 <button onclick="changeBg('#ffe0ed','#fff3f8','#f5bcd5')">Pink</button>
 <button onclick="changeBg('#d8e9ff','#eff7ff','#b8d1ff')">Blue</button>
 <hr><button onclick="lockDesktop()">Lock Screen</button>
 <button onclick="backup()">Export Backup</button>
 <button onclick="restore()">Import Backup</button>
 <p class="small">Data is stored in this browser.</p>`;
}
function changeBg(a,b,c){$("desktop").style.background=`linear-gradient(135deg,${a},${b},${c})`}
function backup(){
 let data={chapters,flash,mistakes,revision,questions,notes};
 let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="student-os-backup.json";a.click();
 URL.revokeObjectURL(a.href);
}
function restore(){
 let i=document.createElement("input");i.type="file";i.accept=".json";
 i.onchange=()=>{
  let f=i.files[0];if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
   try{
    let d=JSON.parse(r.result);
    chapters=d.chapters||[];flash=d.flash||[];mistakes=d.mistakes||[];
    revision=d.revision||[];questions=d.questions||[];notes=d.notes||{};
    save("chapters",chapters);save("flash",flash);save("mistakes",mistakes);
    save("revision",revision);save("questions",questions);save("notes",notes);
    alert("Backup restored!");
   }catch{alert("Invalid backup file")}
  };r.readAsText(f);
 };i.click();
}
</script>
</body>
</html>
