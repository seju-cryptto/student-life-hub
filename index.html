<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students Hub n</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,sans-serif;background:#f5efff;color:#50445f}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:9px 14px;background:#b18adf;color:white}
input,textarea{padding:10px;border:1px solid #eadff5;border-radius:12px;width:100%}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-grad
ient(135deg,#e8d9ff,#fff0f3);z-index:5}
.box{padding:40px;text-align:center;background:#ffffffdd;border-radius:25px}
#desktop{display:none;min-height:100vh;padding:20px}
#apps{display:grid;grid-template-columns:repeat(auto-fill,100px);gap:12px}
.app{padding:15px;text-align:center;background:#fff;border-radius:20px;cursor:pointer}
.window{position:absolute;left:200px;top:130px;width:420px;max-width:95vw;background:white;border-radius:2
0px;box-shadow:0 10px 40px #8870aa44;overflow:hidden}
.head{padding:12px;background:#f3e9ff;cursor:move;display:flex;justify-content:space-between}
.body{padding:15px;max-height:70vh;overflow:auto}
.card{padding:12px;border:1px solid #eee;border-radius:15px;margin:10px 0}
#dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#ffff
ffcc;padding:10px;border-radius:20px}
#dock button{background:#f5efff;color:#50445f}
</style>
</head>
<body>
<div id="lock"><div class="box"><h1>Students Hub n</h1><p>Your study space</p><button 
onclick="enter()">Enter Desktop n</button></div></div>
<div id="desktop">
<h2>n Students Hub n</h2>
<p id="stats">Tasks completed: 0</p>
<div id="apps"></div>
</div>
<div id="dock"></div>
<script>
const names=["Tasks","Planner","Chapter Tracker","Notes Studio","Flashcards","Focus Room","Dream 
Board","Study Journal","Sticky Notes","Analytics","Calculator","Formula Vault","Doubt Tracker","Revision 
Scheduler","Mistake Notebook","Practice Papers","Exam Center","Study Coach","Trash Bin","Settings"];
const icons=["n","n","n","nn","n","n","n","n","n","n","n","n","n","n","n","n","n","n","nn","nn"];
let data=JSON.parse(localStorage.getItem("hub")||"{}");
data.tasks ||= [];data.notes ||= "";data.chapters ||= [];data.xp ||= 0;
function save(){localStorage.setItem("hub",JSON.stringify(data));document.getElementById("stats").textCont
ent="Tasks completed: "+(data.done||0);}
function enter(){document.getElementById("lock").style.display="none";document.getElementById("desktop").s
tyle.display="block";}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"
,"'":"&#39;"}[c]));}
document.getElementById("apps").innerHTML=names.map((n,i)=>`<div class="app" 
onclick="openApp('${n}')"><div style="font-size:30px">${icons[i]}</div>${n}</div>`).join("");
document.getElementById("dock").innerHTML=["Tasks","Planner","Notes Studio","Focus Room"].map(n=>`<button 
onclick="openApp('${n}')">${n}</button>`).join("");
function openApp(n){
let existing=document.querySelector('[data-name="'+n+'"]');if(existing){existing.style.display="block";ret
urn;}
let w=document.createElement("div");w.className="window";w.dataset.name=n;
w.innerHTML=`<div class="head"><b>${n}</b><button onclick="this.closest('.window').remove()">×</button></d
iv><div class="body">${content(n)}</div>`;
document.getElementById("desktop").appendChild(w);drag(w);refresh(n);
}
function drag(w){let h=w.querySelector(".head"),dx,dy;h.onmousedown=e=>{dx=e.clientX-w.offsetLeft;dy=e.cli
entY-w.offsetTop;document.onmousemove=m=>{w.style.left=m.clientX-dx+"px";w.style.top=m.clientY-dy+"px";};d
ocument.onmouseup=()=>document.onmousemove=null;};}
function content(n){
if(n==="Tasks")return `<h3>Tasks</h3><input id="task" placeholder="Add task"><button 
onclick="addTask()">Add</button><div id="tasklist"></div>`;
if(n==="Planner")return `<h3>Planner</h3><input id="date" type="date"><textarea id="plan" 
placeholder="Study plan"></textarea><button onclick="savePlan()">Save</button><div id="plans"></div>`;
if(n==="Chapter Tracker")return `<h3>Chapter Tracker</h3><input id="chapter" 
placeholder="Chapter"><button onclick="addChapter()">Add</button><div id="chapters"></div>`;
if(n==="Notes Studio")return `<h3>Notes</h3><textarea id="notes" 
style="min-height:220px">${esc(data.notes)}</textarea><button onclick="saveNotes()">Save</button>`;
if(n==="Flashcards")return `<h3>Flashcards</h3><input id="q" placeholder="Question"><input id="a" 
placeholder="Answer"><button onclick="addFlash()">Add</button><div id="flash"></div>`;
if(n==="Focus Room")return `<h3>Focus Timer</h3><div style="font-size:35px" id="timer">25:00</div><button 
onclick="startTimer()">Start</button><button onclick="stopTimer()">Pause</button><button 
onclick="resetTimer()">Reset</button>`;
if(n==="Dream Board")return `<h3>Dream Board</h3><textarea 
id="dream">${esc(data.dream)}</textarea><button onclick="saveDream()">Save</button>`;
if(n==="Study Journal")return `<h3>Journal</h3><textarea 
id="journal">${esc(data.journal)}</textarea><button onclick="saveJournal()">Save</button>`;
if(n==="Sticky Notes")return `<h3>Sticky Notes</h3><textarea 
id="sticky">${esc(data.sticky)}</textarea><button onclick="saveSticky()">Save</button>`;
if(n==="Analytics")return `<h3>Analytics</h3><p>Completed: ${data.done||0}</p><p>XP: 
${data.xp||0}</p><p>Chapters: ${data.chapters.length}</p>`;
if(n==="Calculator")return `<h3>Calculator</h3><input id="calc" placeholder="Arithmetic 
expression"><button onclick="calc()">Calculate</button><p id="result"></p>`;
if(n==="Formula Vault")return `<h3>Formula Vault</h3><input id="f" placeholder="Formula"><button 
onclick="addFormula()">Save</button><div id="formulas"></div>`;
if(n==="Doubt Tracker")return `<h3>Doubt Tracker</h3><textarea id="doubt" placeholder="Your 
doubt"></textarea><button onclick="addDoubt()">Add</button><div id="doubts"></div>`;
if(n==="Revision Scheduler")return `<h3>Revision Scheduler</h3><input id="rev" 
placeholder="Chapter"><input id="rd" type="date"><button onclick="addRev()">Add</button><div 
id="revs"></div>`;
if(n==="Mistake Notebook")return `<h3>Mistake Notebook</h3><textarea id="mistake"></textarea><button 
onclick="addMistake()">Save</button><div id="mistakes"></div>`;
if(n==="Practice Papers")return `<h3>Practice Papers</h3><input id="paper" placeholder="Paper 
name"><button onclick="addPaper()">Add</button><div id="papers"></div>`;
if(n==="Exam Center")return `<h3>Exam Center</h3><input id="exam" placeholder="Exam"><input id="ed" 
type="date"><button onclick="addExam()">Add</button><div id="exams"></div>`;
if(n==="Study Coach")return `<h3>Study Coach</h3><p>Pick one task, focus on it, and start small n
</p><button onclick="openApp('Tasks')">Tasks</button>`;
if(n==="Trash Bin")return `<h3>Trash Bin</h3><div id="trash"></div>`;
if(n==="Settings")return `<h3>Settings</h3><button onclick="backup()">Export Backup</button><button 
onclick="resetData()">Reset Data</button>`;
}
function refresh(n){if(n==="Tasks")tasks();if(n==="Planner")plans();if(n==="Chapter 
Tracker")chapters();if(n==="Flashcards")flashcards();if(n==="Formula Vault")formulas();if(n==="Doubt 
Tracker")doubts();if(n==="Revision Scheduler")revs();if(n==="Mistake 
Notebook")mistakes();if(n==="Practice Papers")papers();if(n==="Exam Center")exams();if(n==="Trash 
Bin")trash();}
function addTask(){let v=document.getElementById("task").value.trim();if(!v)return;data.tasks.push({v,done:
false});save();tasks();}
function tasks(){let el=document.getElementById("tasklist");if(el)el.innerHTML=data.tasks.map((t,i)=>`<div
 class="card"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTask(${i},this.checked)" 
style="width:auto"><span>${esc(t.v)}</span><button onclick="delTask(${i})">×</button></div>`).join("");}
function toggleTask(i,v){data.tasks[i].done=v;if(v){data.done=(data.done||0)+1;data.xp+=10;}save();tasks();
}
function delTask(i){data.trash||=[];data.trash.push(data.tasks[i].v);data.tasks.splice(i,1);save();tasks();
}
function savePlan(){data.plans||=[];data.plans.push({d:document.getElementById("date").value,t:document.ge
tElementById("plan").value});save();plans();}
function plans(){let el=document.getElementById("plans");if(el)el.innerHTML=(data.plans||[]).map(p=>`<div 
class="card">${esc(p.d)} ${esc(p.t)}</div>`).join("");}
function addChapter(){let v=document.getElementById("chapter").value.trim();if(!v)return;data.chapters.pus
h({v,s:false});save();chapters();}
function chapters(){let el=document.getElementById("chapters");if(el)el.innerHTML=data.chapters.map((c,i)=
>`<div class="card"><input type="checkbox" style="width:auto" ${c.s?"checked":""} 
onchange="data.chapters[${i}].s=this.checked;save()">${esc(c.v)}</div>`).join("");}
function saveNotes(){data.notes=document.getElementById("notes").value;save();}
function addFlash(){data.flash||=[];data.flash.push({q:document.getElementById("q").value,a:document.getEl
ementById("a").value});save();flashcards();}
function flashcards(){let el=document.getElementById("flash");if(el)el.innerHTML=(data.flash||[]).map(f=>`
<div class="card"><b>${esc(f.q)}</b><details><summary>Answer</summary>${esc(f.a)}</details></div>`).join(""
);}
let secs=1500,interval=null;
function draw(){let el=document.getElementById("timer");if(el)el.textContent=Math.floor(secs/60).toString()
.padStart(2,"0")+":"+ (secs%60).toString().padStart(2,"0");}
function startTimer(){if(interval)return;interval=setInterval(()=>{secs--;draw();if(secs<=0){stopTimer();a
lert("Focus session completed!");data.xp+=25;save();}},1000);}
function stopTimer(){clearInterval(interval);interval=null;}
function resetTimer(){stopTimer();secs=1500;draw();}
function saveDream(){data.dream=document.getElementById("dream").value;save();}
function saveJournal(){data.journal=document.getElementById("journal").value;save();}
function saveSticky(){data.sticky=document.getElementById("sticky").value;save();}
function calc(){try{document.getElementById("result").textContent=arithmetic(document.getElementById("calc"
).value);}catch{document.getElementById("result").textContent="Invalid expression";}}
function arithmetic(s){s=s.replace(/\s/g,"");if(!/^[0-9+\-*/().%]+$/.test(s))throw Error();let 
t=s.match(/\d+(?:\.\d+)?|[()+\-*/%]/g)||[],i=0;function f(){let x=t[i++];if(x==="("){let 
v=sum();if(t[i++]!==")")throw Error();return v;}if(x==="-")return-f();if(x==="+")return 
f();if(x==null||isNaN(+x))throw Error();return+x;}function term(){let 
v=f();while(["*","/","%"].includes(t[i])){let o=t[i++],b=f();v=o==="*"?v*b:o==="/"?v/b:v%b;}return 
v;}function sum(){let v=term();while(["+","-"].includes(t[i])){let 
o=t[i++],b=term();v=o==="+"?v+b:v-b;}return v;}let r=sum();if(i!==t.length||!isFinite(r))throw 
Error();return r;}
function addFormula(){data.formulas||=[];data.formulas.push(document.getElementById("f").value);save();for
mulas();}
function formulas(){let el=document.getElementById("formulas");if(el)el.innerHTML=(data.formulas||[]).map(
x=>`<div class="card">${esc(x)}</div>`).join("");}
function addDoubt(){data.doubts||=[];data.doubts.push(document.getElementById("doubt").value);save();doubt
s();}
function doubts(){let el=document.getElementById("doubts");if(el)el.innerHTML=(data.doubts||[]).map(x=>`<d
iv class="card">${esc(x)}</div>`).join("");}
function addRev(){data.revs||=[];data.revs.push({v:document.getElementById("rev").value,d:document.getElem
entById("rd").value});save();revs();}
function revs(){let el=document.getElementById("revs");if(el)el.innerHTML=(data.revs||[]).map(x=>`<div 
class="card">${esc(x.d)} ${esc(x.v)}</div>`).join("");}
function addMistake(){data.mistakes||=[];data.mistakes.push(document.getElementById("mistake").value);save
();mistakes();}
function mistakes(){let el=document.getElementById("mistakes");if(el)el.innerHTML=(data.mistakes||[]).map(
x=>`<div class="card">${esc(x)}</div>`).join("");}
function addPaper(){data.papers||=[];data.papers.push(document.getElementById("paper").value);save();paper
s();}
function papers(){let el=document.getElementById("papers");if(el)el.innerHTML=(data.papers||[]).map(x=>`<d
iv class="card">${esc(x)}</div>`).join("");}
function addExam(){data.exams||=[];data.exams.push({n:document.getElementById("exam").value,d:document.get
ElementById("ed").value});save();exams();}
function exams(){let el=document.getElementById("exams");if(el)el.innerHTML=(data.exams||[]).map(x=>`<div 
class="card">${esc(x.n)} ${esc(x.d)}</div>`).join("");}
function trash(){let el=document.getElementById("trash");if(el)el.innerHTML=(data.trash||[]).map(x=>`<div 
class="card">${esc(x)}</div>`).join("")||"Empty";}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new 
Blob([JSON.stringify(data)],{type:"application/json"}));a.download="students-hub.json";a.click();}
function resetData(){if(confirm("Reset all saved data?")){localStorage.removeItem("hub");location.reload();
}}
save();
</script>
</body>
</html>
