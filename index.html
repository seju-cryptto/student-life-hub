
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student OS | Study Edition</title>
<style>
:root{
 --bg:#f4f0ff;--panel:#fff;--accent:#9370db;
 --text:#41345b;--soft:#eee7ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{
 border:0;padding:10px 13px;border-radius:10px;
 background:var(--accent);color:white;cursor:pointer;
}
button:hover{opacity:.85}
input,select,textarea{
 padding:10px;border:1px solid #ddd;border-radius:10px;
 width:100%;background:white;color:#333;
}
textarea{resize:vertical;min-height:70px}
#desktop{min-height:100vh;padding:18px 18px 80px;background:var(--bg)}
.top{
 display:flex;justify-content:space-between;align-items:center;
 flex-wrap:wrap;gap:10px;
}
.top h1{margin:5px 0}
#nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
#nav button{background:var(--panel);color:var(--text)}
#nav button.active{background:var(--accent);color:white}
#view{max-width:1200px;margin:auto}
.cards{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:15px;
}
.card{
 background:var(--panel);border-radius:18px;
 padding:18px;box-shadow:0 4px 18px #00000008;
}
.card h3{margin-top:0}
.big{font-size:28px;font-weight:bold}
.muted{opacity:.65;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
hr{border:0;border-top:1px solid #eee;margin:15px 0}
.progress{
 height:10px;background:#eae4f5;border-radius:20px;overflow:hidden;
}
.progress div{height:100%;background:var(--accent);width:0}
.item{
 padding:12px;background:var(--soft);border-radius:12px;
 margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.item>*{flex:1}
.item button{flex:0 0 auto}
#bar{
 position:fixed;bottom:0;left:0;width:100%;height:58px;
 background:#ffffffd9;backdrop-filter:blur(10px);
 display:flex;justify-content:space-between;align-items:center;
 padding:10px 18px;z-index:10;
}
#bar button{background:var(--soft);color:var(--text)}
.badge{background:var(--soft);padding:5px 10px;border-radius:20px;font-size:12px}
select{min-width:120px}
@media(max-width:600px){
 #desktop{padding:12px 12px 75px}
 .big{font-size:22px}
}
</style>
</head>
<body>
<div id="desktop">
<div class="top">
 <div>
  <h1>🎓 Student OS</h1>
  <div class="muted">Your personal study workspace.</div>
 </div>
 <div class="row" style="flex:0 0 auto">
  <span class="badge" id="today"></span>
 </div>
</div>

<div id="nav">
 <button onclick="show('home')" class="active">🏠 Home</button>
 <button onclick="show('chapters')">📊 Chapters</button>
 <button onclick="show('flash')">📖 Flashcards</button>
 <button onclick="show('mistakes')">❌ Mistakes</button>
 <button onclick="show('revision')">🔁 Revision</button>
 <button onclick="show('practice')">🧪 Practice</button>
 <button onclick="show('exam')">📝 Exam</button>
</div>
<div id="view"></div>
</div>

<div id="bar">
 <button onclick="show('home')">🎓 Student OS</button>
 <span id="barStatus">Study Edition</span>
 <button onclick="show('revision')">🔁 Revise</button>
</div>

<script>
const subjects=["Physics","Chemistry","Maths","English","Computer Science"];
const DB={
 chapters:JSON.parse(localStorage.getItem("so_ch")||"[]"),
 cards:JSON.parse(localStorage.getItem("so_fc")||"[]"),
 mistakes:JSON.parse(localStorage.getItem("so_mi")||"[]"),
 revisions:JSON.parse(localStorage.getItem("so_re")||"[]"),
 questions:JSON.parse(localStorage.getItem("so_qu")||"[]"),
 sessions:JSON.parse(localStorage.getItem("so_se")||"[]"),
 exams:JSON.parse(localStorage.getItem("so_ex")||"[]")
};
function save(){
 for(const k in DB)localStorage.setItem("so_"+({
 chapters:"ch",cards:"fc",mistakes:"mi",revisions:"re",
 questions:"qu",sessions:"se",exams:"ex"
 })[k],JSON.stringify(DB[k]));
}
function uid(){return Date.now()+Math.random()}
function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function show(page){
 document.querySelectorAll("#nav button").forEach(b=>b.classList.remove("active"));
 let map={home:0,chapters:1,flash:2,mistakes:3,revision:4,practice:5,exam:6};
 if(map[page]!==undefined)document.querySelectorAll("#nav button")[map[page]].classList.add("active");
 const v=document.getElementById("view");
 if(page==="home")home(v);
 if(page==="chapters")chapters(v);
 if(page==="flash")flash(v);
 if(page==="mistakes")mistakes(v);
 if(page==="revision")revision(v);
 if(page==="practice")practice(v);
 if(page==="exam")exam(v);
}
function home(v){
 let mastered=DB.chapters.filter(x=>x.status==="Mastered").length;
 let due=DB.revisions.filter(x=>x.date<=today()).length;
 let pct=DB.chapters.length?Math.round(mastered/DB.chapters.length*100):0;
 v.innerHTML=`
 <div class="cards">
  <div class="card"><h3>📚 Total Chapters</h3><div class="big">${DB.chapters.length}</div></div>
  <div class="card"><h3>🏆 Mastered</h3><div class="big">${mastered}</div></div>
  <div class="card"><h3>🔁 Revision Due</h3><div class="big">${due}</div></div>
  <div class="card"><h3>📖 Flashcards</h3><div class="big">${DB.cards.length}</div></div>
 </div>
 <div class="card" style="margin-top:15px">
 <h3>📈 Overall Chapter Mastery</h3>
 <div class="progress"><div style="width:${pct}%"></div></div>
 <p>${pct}% mastered</p>
 </div>
 <div class="cards" style="margin-top:15px">
 <div class="card"><h3>🔁 Due Today</h3><p>${due} revision item(s)</p><button onclick="show('revision')">Open revision</button></div>
 <div class="card"><h3>❌ Mistake Bank</h3><p>${DB.mistakes.length} saved mistakes</p><button onclick="show('mistakes')">Review mistakes</button></div>
 <div class="card"><h3>🧪 Practice</h3><p>${DB.questions.length} questions</p><button onclick="show('practice')">Start practice</button></div>
 </div>
 <div class="card" style="margin-top:15px">
 <h3>⚡ Quick Actions</h3>
 <div class="row">
 <button onclick="show('chapters')">Add chapter</button>
 <button onclick="show('flash')">Add flashcard</button>
 <button onclick="show('mistakes')">Save mistake</button>
 <button onclick="show('exam')">Start test</button>
 </div></div>`;
}
function chapters(v){
 v.innerHTML=`
 <div class="card">
 <h2>📊 Chapter Mastery Tracker</h2>
 <div class="row">
 <select id="chSubject">${subjects.map(s=>`<option>${s}</option>`).join("")}</select>
 <input id="chName" placeholder="Chapter name">
 </div>
 <div class="row">
 <select id="chStatus">
 <option>Learning</option><option>Practising</option>
 <option>Revised</option><option>Mastered</option>
 </select>
 <button onclick="addChapter()">Add Chapter</button>
 </div>
 </div>
 <div class="card" style="margin-top:15px">
 <div class="row"><select id="chFilter" onchange="renderChList()">
 <option value="">All Subjects</option>${subjects.map(s=>`<option>${s}</option>`).join("")}
 </select></div>
 <div id="chList"></div>
 </div>`;
 renderChList();
}
function addChapter(){
 let n=document.getElementById("chName").value.trim();
 if(!n)return alert("Enter chapter name");
 DB.chapters.push({id:uid(),subject:document.getElementById("chSubject").value,name:n,status:document.getElementById("chStatus").value});
 save();show("chapters");
}
function renderChList(){
 let el=document.getElementById("chList");if(!el)return;
 let f=document.getElementById("chFilter").value;
 let arr=DB.chapters.filter(c=>!f||c.subject===f);
 el.innerHTML=arr.map(c=>`
 <div class="item">
 <span><b>${esc(c.name)}</b><br><small>${esc(c.subject)}</small></span>
 <select onchange="changeCh(${c.id},this.value)">
 ${["Learning","Practising","Revised","Mastered"].map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}
 </select>
 <button onclick="delCh(${c.id})">🗑️</button>
 </div>`).join("")||"No chapters yet.";
}
function changeCh(id,s){let c=DB.chapters.find(x=>x.id==id);if(c)c.status=s;save();renderChList()}
function delCh(id){DB.chapters=DB.chapters.filter(x=>x.id!=id);save();renderChList()}

function flash(v){
 v.innerHTML=`
 <div class="card">
 <h2>📖 Active Recall Flashcards</h2>
 <div class="row"><select id="fcSub">${subjects.map(s=>`<option>${s}</option>`).join("")}</select></div>
 <textarea id="fcQ" placeholder="Question"></textarea>
 <textarea id="fcA" placeholder="Answer"></textarea>
 <button onclick="addFC()">Save Flashcard</button>
 </div>
 <div class="card" style="margin-top:15px">
 <h3>Study Cards</h3><div id="fcList"></div>
 </div>`;
 renderFC();
}
function addFC(){
 let q=document.getElementById("fcQ").value.trim(),a=document.getElementById("fcA").value.trim();
 if(!q||!a)return alert("Enter both question and answer");
 DB.cards.push({id:uid(),subject:document.getElementById("fcSub").value,q,a});
 save();show("flash");
}
function renderFC(){
 let el=document.getElementById("fcList");if(!el)return;
 el.innerHTML=DB.cards.map(c=>`
 <div class="item" style="display:block">
 <span class="badge">${esc(c.subject)}</span>
 <p><b>${esc(c.q)}</b></p>
 <button onclick="reveal(${c.id})">Reveal Answer</button>
 <div id="ans${c.id}" style="display:none;margin-top:10px">${esc(c.a)}</div>
 <button onclick="delFC(${c.id})">Delete</button>
 </div>`).join("")||"No cards yet.";
}
function reveal(id){let e=document.getElementById("ans"+id);e.style.display=e.style.display==="none"?"block":"none"}
function delFC(id){DB.cards=DB.cards.filter(x=>x.id!=id);save();renderFC()}

function mistakes(v){
 v.innerHTML=`
 <div class="card">
 <h2>❌ Mistake Bank</h2>
 <div class="row"><select id="miSub">${subjects.map(s=>`<option>${s}</option>`).join("")}</select><input id="miCh" placeholder="Chapter"></div>
 <textarea id="miQ" placeholder="Question or mistake"></textarea>
 <textarea id="miWhy" placeholder="Why was it wrong?"></textarea>
 <textarea id="miCorrect" placeholder="Correct approach / concept"></textarea>
 <button onclick="addMi()">Save Mistake</button>
 </div>
 <div class="card" style="margin-top:15px"><h3>Saved Mistakes</h3><div id="miList"></div></div>`;
 renderMi();
}
function addMi(){
 let q=document.getElementById("miQ").value.trim();
 if(!q)return alert("Enter the mistake");
 DB.mistakes.push({id:uid(),subject:document.getElementById("miSub").value,chapter:document.getElementById("miCh").value,q,why:document.getElementById("miWhy").value,correct:document.getElementById("miCorrect").value});
 save();show("mistakes");
}
function renderMi(){
 let el=document.getElementById("miList");if(!el)return;
 el.innerHTML=DB.mistakes.map(m=>`
 <div class="item" style="display:block">
 <b>${esc(m.subject)} — ${esc(m.chapter)}</b>
 <p>${esc(m.q)}</p>
 <details><summary>Review reason and correction</summary>
 <p><b>Reason:</b> ${esc(m.why)}</p>
 <p><b>Correction:</b> ${esc(m.correct)}</p></details>
 <button onclick="delMi(${m.id})">Delete</button>
 <button onclick="scheduleMi(${m.id})">Add revision</button>
 </div>`).join("")||"No mistakes saved.";
}
function delMi(id){DB.mistakes=DB.mistakes.filter(x=>x.id!=id);save();renderMi()}
function scheduleMi(id){
 let m=DB.mistakes.find(x=>x.id==id);if(!m)return;
 DB.revisions.push({id:uid(),type:"mistake",ref:id,title:m.q,subject:m.subject,date:today()});
 save();alert("Added to revision queue!");
}

function today(){
 let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function revision(v){
 let due=DB.revisions.filter(x=>x.date<=today());
 v.innerHTML=`
 <div class="card">
 <h2>🔁 Revision Scheduler</h2>
 <p>Schedule chapters, flashcards or mistakes for revision.</p>
 <div class="row"><select id="reSub">${subjects.map(s=>`<option>${s}</option>`).join("")}</select>
 <input id="reTitle" placeholder="Topic / chapter"></div>
 <input type="date" id="reDate" value="${today()}">
 <button onclick="addRe()">Schedule Revision</button>
 </div>
 <div class="card" style="margin-top:15px">
 <h3>📌 Due / Upcoming</h3><div id="reList"></div>
 </div>
 <div class="card" style="margin-top:15px">
 <h3>📍 Revision due today</h3>
 <p>${due.length} item(s)</p>
 </div>`;
 renderRe();
}
function addRe(){
 let t=document.getElementById("reTitle").value.trim(),d=document.getElementById("reDate").value;
 if(!t||!d)return alert("Enter topic and date");
 DB.revisions.push({id:uid(),type:"topic",title:t,subject:document.getElementById("reSub").value,date:d});
 save();show("revision");
}
function renderRe(){
 let el=document.getElementById("reList");if(!el)return;
 el.innerHTML=DB.revisions.sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`
 <div class="item">
 <span><b>${esc(r.title)}</b><br>${esc(r.subject)}<br><small>${esc(r.date)}</small></span>
 <span class="badge">${r.date<=today()?"DUE":"UPCOMING"}</span>
 <button onclick="completeRe(${r.id})">✔ Done</button>
 <button onclick="delRe(${r.id})">🗑️</button>
 </div>`).join("")||"Nothing scheduled.";
}
function completeRe(id){
 DB.revisions=DB.revisions.filter(x=>x.id!=id);
 DB.sessions.push({date:today(),type:"revision"});
 save();show("revision");
}
function delRe(id){DB.revisions=DB.revisions.filter(x=>x.id!=id);save();renderRe()}

function practice(v){
 v.innerHTML=`
 <div class="card">
 <h2>🧪 Practice Arena</h2>
 <div class="row"><select id="quSub">${subjects.map(s=>`<option>${s}</option>`).join("")}</select></div>
 <textarea id="quText" placeholder="Question"></textarea>
 <input id="quOpt1" placeholder="Option A">
 <input id="quOpt2" placeholder="Option B">
 <input id="quOpt3" placeholder="Option C">
 <input id="quOpt4" placeholder="Option D">
 <select id="quCorrect"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select>
 <button onclick="addQu()">Add MCQ</button>
 </div>
 <div class="card" style="margin-top:15px">
 <h3>Practice questions</h3><div id="quList"></div>
 <button onclick="startQuiz()">Start Quiz</button>
 </div>
 <div class="card" style="margin-top:15px">
 <h3>🏅 Practice Results</h3><div id="quResult"></div>
 </div>`;
 renderQu();
}
function addQu(){
 let q=document.getElementById("quText").value.trim();
 let opts=[1,2,3,4].map(i=>document.getElementById("quOpt"+i).value.trim());
 if(!q||opts.some(x=>!x))return alert("Fill question and all four options");
 DB.questions.push({id:uid(),subject:document.getElementById("quSub").value,q,opts,correct:Number(document.getElementById("quCorrect").value)});
 save();show("practice");
}
function renderQu(){
 let el=document.getElementById("quList");if(!el)return;
 el.innerHTML=DB.questions.map(q=>`<div class="item"><span>${esc(q.subject)}: ${esc(q.q)}</span><button onclick="delQu(${q.id})">Delete</button></div>`).join("")||"No questions.";
}
function delQu(id){DB.questions=DB.questions.filter(x=>x.id!=id);save();renderQu()}
function startQuiz(){
 if(!DB.questions.length)return alert("Add questions first!");
 let arr=DB.questions.slice().sort(()=>Math.random()-.5);
 let v=document.getElementById("quResult");
 let score=0,idx=0;
 function next(){
 if(idx>=arr.length){
 v.innerHTML=`<h2>Score: ${score}/${arr.length}</h2>
 <p>${Math.round(score/arr.length*100)}% accuracy</p>
 <button onclick="show('practice')">Back</button>`;
 DB.sessions.push({date:today(),type:"quiz",score,total:arr.length});
 save();return;
 }
 let q=arr[idx];
 v.innerHTML=`<h3>${idx+1}/${arr.length} — ${esc(q.subject)}</h3><p>${esc(q.q)}</p>
 ${q.opts.map((o,i)=>`<button style="display:block;width:100%;margin:5px 0;background:var(--soft);color:var(--text)" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}`;
 window.answer=function(n){
 if(n===q.correct)score++;
 else{
 DB.mistakes.push({id:uid(),subject:q.subject,chapter:"Practice",q:q.q,why:"Incorrect quiz answer",correct:q.opts[q.correct]});
 save();
 }
 idx++;next();
 };
 }
 next();
}

function exam(v){
 v.innerHTML=`
 <div class="card">
 <h2>📝 Exam Simulator</h2>
 <p>Create a timed test using your saved MCQs.</p>
 <div class="row"><input id="exMins" type="number" min="1" max="180" value="10" placeholder="Minutes"></div>
 <button onclick="startExam()">Start Exam</button>
 </div>
 <div class="card" style="margin-top:15px"><div id="examArea"></div></div>`;
}
function startExam(){
 if(!DB.questions.length)return alert("Add MCQs in Practice Arena first.");
 let arr=DB.questions.slice().sort(()=>Math.random()-.5);
 let duration=Math.max(1,Number(document.getElementById("exMins").value)||10)*60;
 let end=Date.now()+duration*1000,idx=0,score=0,answered=false;
 let area=document.getElementById("examArea");
 function finish(){
 clearInterval(interval);
 area.innerHTML=`<h2>Exam Finished!</h2><div class="big">${score}/${arr.length}</div>
 <p>Accuracy: ${Math.round(score/arr.length*100)}%</p><button onclick="show('exam')">Back</button>`;
 DB.exams.push({date:today(),score,total:arr.length});
 DB.sessions.push({date:today(),type:"exam",score,total:arr.length});
 save();
 }
 function draw(){
 if(Date.now()>=end){finish();return}
 if(idx>=arr.length){finish();return}
 let q=arr[idx];
 area.innerHTML=`<h3>Question ${idx+1}/${arr.length}</h3>
 <div class="badge">${esc(q.subject)}</div><h4>${esc(q.q)}</h4>
 ${q.opts.map((o,i)=>`<button style="display:block;width:100%;margin:5px 0;background:var(--soft);color:var(--text)" onclick="examAnswer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}
 <p id="exTime"></p>`;
 window.examAnswer=function(n){
 if(answered)return;answered=true;
 if(n===q.correct)score++;
 else DB.mistakes.push({id:uid(),subject:q.subject,chapter:"Exam",q:q.q,why:"Incorrect exam answer",correct:q.opts[q.correct]});
 save();idx++;answered=false;draw();
 };
 }
 let interval=setInterval(()=>{
 let rem=Math.max(0,Math.ceil((end-Date.now())/1000));
 let t=document.getElementById("exTime");
 if(t)t.textContent="⏳ "+Math.floor(rem/60)+":"+String(rem%60).padStart(2,"0");
 if(rem<=0)finish();
 },500);
 draw();
}
document.getElementById("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});
show("home");
</script>
</body>
</html>
