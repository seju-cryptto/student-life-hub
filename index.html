
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Students Hub</title>
<style>
*{box-sizing:border-box}
:root{--accent:#cbb8ff}
body{
 margin:0;font-family:Segoe UI,Arial,sans-serif;
 color:#29243b;min-height:100vh;overflow:hidden;
 background:linear-gradient(135deg,#d9caff,#cbe9ff,#ffe0ed);
}
body.dark{color:#f5f1ff;background:linear-gradient(135deg,#17152a,#292442,#183247)}
button{
 cursor:pointer;border:0;border-radius:12px;padding:10px 14px;
 background:var(--accent);color:#302444;font-weight:600;
 transition:.2s;
}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
input,textarea,select{
 padding:11px;border-radius:12px;border:1px solid #ccc;
 width:100%;margin:6px 0;color:#29243a;background:#fff;font:inherit;
}
textarea{resize:vertical;min-height:100px}
#desktop{height:100vh;padding:22px;position:relative}
.brand{font-size:23px;font-weight:800}
.sub{font-size:12px;opacity:.75}
.icons{display:flex;flex-wrap:wrap;gap:15px;margin-top:25px;width:200px}
.iconbtn{
 width:80px;height:86px;background:rgba(255,255,255,.4);
 backdrop-filter:blur(10px);color:inherit;border-radius:17px;
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:6px;
}
.iconbtn .emoji{font-size:30px}
.iconbtn small{font-size:11px}
.win{
 position:absolute;left:220px;top:100px;width:min(440px,90vw);
 max-height:75vh;overflow:auto;background:rgba(255,255,255,.94);
 color:#29243b;border-radius:20px;
 box-shadow:0 20px 60px rgba(20,10,50,.2);
 border:1px solid rgba(255,255,255,.6);z-index:5;
 animation:appear .2s ease;
}
@keyframes appear{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.win.darkwin{background:rgba(32,29,49,.96);color:#f4edff}
.win.wide{width:min(620px,94vw)}
.winhead{
 display:flex;justify-content:space-between;align-items:center;
 padding:12px 15px;background:rgba(180,160,230,.17);
 cursor:move;position:sticky;top:0;z-index:2;
 touch-action:none;
}
.winhead b{font-size:14px}
.winbuttons{display:flex;gap:5px}
.winbuttons button{padding:5px 9px}
.content{padding:18px}
.hidden{display:none!important}
.task{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ddd}
.task span{flex:1;overflow-wrap:anywhere}
.task button{padding:6px 10px}
.bar{height:10px;border-radius:20px;background:#ddd;margin:10px 0;overflow:hidden}
.bar div{height:100%;background:#9470d8;width:0;transition:.3s}
#clock,#fclock{font-size:52px;font-weight:800;text-align:center;margin:12px}
.walls{display:flex;gap:9px;flex-wrap:wrap}
.wall{width:48px;height:48px;border-radius:12px;cursor:pointer;border:2px solid white}
#dock{
 position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
 background:rgba(255,255,255,.7);backdrop-filter:blur(15px);
 padding:9px;border-radius:18px;display:flex;gap:7px;z-index:100;
 max-width:96vw;overflow:auto;
}
#dock button{white-space:nowrap;font-size:12px;padding:9px}
#lockScreen{
 position:fixed;inset:0;z-index:99999;
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;text-align:center;padding:25px;color:white;
 background:linear-gradient(135deg,#19152f,#483568,#253f59);
}
#lockClock{font-size:clamp(65px,12vw,115px);font-weight:800;letter-spacing:3px}
#lockDate{font-size:18px;margin:10px}
.lockCard{
 background:rgba(255,255,255,.12);
 border:1px solid rgba(255,255,255,.18);
 backdrop-filter:blur(20px);padding:35px;border-radius:30px;
 max-width:500px;width:100%;
}
#enterDesk{margin-top:25px;padding:15px 30px;border-radius:16px;font-size:16px}
.lockSub{opacity:.8;font-size:14px;margin-top:15px}
#fullScreenFocus{
 position:fixed;inset:0;background:linear-gradient(135deg,#211c37,#332653,#24384b);
 color:white;z-index:9999;display:flex;align-items:center;
 justify-content:center;flex-direction:column;padding:20px;text-align:center;
}
#fullScreenFocus button{margin:5px}
@media(max-width:600px){
 #desktop{padding:15px}
 .win{left:5%;top:120px;width:90vw}
 .icons{width:100%;gap:8px}
 #dock{width:96%;justify-content:center;flex-wrap:wrap}
}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
 <div class="lockCard">
  <div style="font-size:45px">✦</div>
  <div id="lockClock">00:00</div>
  <div id="lockDate"></div>
  <h2>Welcome to Students Hub</h2>
  <p>Your space. Your goals. Your progress.</p>
  <button id="enterDesk">Enter Desktop →</button>
  <div class="lockSub">A little progress every day.</div>
 </div>
</div>

<!-- DESKTOP -->
<div id="desktop">
 <div class="brand">✦ Students Hub</div>
 <div class="sub" id="today"></div>

 <div class="icons">
  <button class="iconbtn" onclick="openWin('focus')"><span class="emoji">🌙</span><small>Deep Focus</small></button>
  <button class="iconbtn" onclick="openWin('notes')"><span class="emoji">📝</span><small>Notes</small></button>
  <button class="iconbtn" onclick="openWin('tasks')"><span class="emoji">📋</span><small>Tasks</small></button>
  <button class="iconbtn" onclick="openWin('chapters')"><span class="emoji">📚</span><small>Chapters</small></button>
  <button class="iconbtn" onclick="openWin('custom')"><span class="emoji">🎨</span><small>Customize</small></button>
  <button class="iconbtn" onclick="openWin('progress')"><span class="emoji">📊</span><small>Progress</small></button>
 </div>

 <!-- FOCUS -->
 <div class="win hidden" id="focus">
  <div class="winhead"><b>🌙 Deep Focus</b><div class="winbuttons">
   <button onclick="minWin('focus')">_</button><button onclick="closeWin('focus')">×</button>
  </div></div>
  <div class="content">
   <input id="focusTitle" placeholder="What are you studying?">
   <div id="clock">25:00</div>
   <button onclick="startTimer()">▶ Start</button>
   <button onclick="pauseTimer()">⏸ Pause</button>
   <button onclick="resetTimer()">↺ Reset</button>
   <button onclick="fullFocus()">⛶ Full screen</button>
   <hr>
   <label>Session length</label>
   <select id="minutes" onchange="changeMinutes()">
    <option value="25">25 minutes</option>
    <option value="45">45 minutes</option>
    <option value="50">50 minutes</option>
    <option value="60">60 minutes</option>
   </select>
  </div>
 </div>

 <!-- NOTES -->
 <div class="win hidden" id="notes">
  <div class="winhead"><b>📝 Quick Notes</b><div class="winbuttons">
   <button onclick="minWin('notes')">_</button><button onclick="closeWin('notes')">×</button>
  </div></div>
  <div class="content">
   <textarea id="noteText" placeholder="Your notes..."></textarea>
   <div id="noteStatus" class="sub">Autosave enabled</div>
   <button onclick="saveNotes()">Save</button>
   <button onclick="clearNotes()">Clear</button>
  </div>
 </div>

 <!-- TASKS -->
 <div class="win hidden" id="tasks">
  <div class="winhead"><b>📋 Tasks</b><div class="winbuttons">
   <button onclick="minWin('tasks')">_</button><button onclick="closeWin('tasks')">×</button>
  </div></div>
  <div class="content">
   <input id="taskText" placeholder="Add task">
   <button onclick="addTask()">+ Add task</button>
   <div id="taskList"></div>
   <div class="bar"><div id="taskBar"></div></div>
   <div id="taskInfo" class="sub"></div>
  </div>
 </div>

 <!-- CHAPTERS -->
 <div class="win wide hidden" id="chapters">
  <div class="winhead"><b>📚 Chapter Tracker</b><div class="winbuttons">
   <button onclick="minWin('chapters')">_</button><button onclick="closeWin('chapters')">×</button>
  </div></div>
  <div class="content">
   <select id="subj">
    <option>Physics</option><option>Chemistry</option>
    <option>Mathematics</option><option>English</option><option>Computer Science</option>
   </select>
   <input id="chapText" placeholder="Chapter name">
   <button onclick="addChapter()">+ Add chapter</button>
   <div id="chapterList"></div>
  </div>
 </div>

 <!-- CUSTOMIZE -->
 <div class="win hidden" id="custom">
  <div class="winhead"><b>🎨 Customize Desktop</b><div class="winbuttons">
   <button onclick="minWin('custom')">_</button><button onclick="closeWin('custom')">×</button>
  </div></div>
  <div class="content">
   <h4>Wallpaper</h4>
   <div class="walls">
    <div class="wall" style="background:linear-gradient(135deg,#e5d7ff,#d7efff)" onclick="wallpaper(0)"></div>
    <div class="wall" style="background:linear-gradient(135deg,#b9e6ff,#c9f5df)" onclick="wallpaper(1)"></div>
    <div class="wall" style="background:linear-gradient(135deg,#ffc8df,#ffdfba)" onclick="wallpaper(2)"></div>
    <div class="wall" style="background:linear-gradient(135deg,#212136,#41305e)" onclick="wallpaper(3)"></div>
    <div class="wall" style="background:linear-gradient(135deg,#d5e7c8,#9cb8a0)" onclick="wallpaper(4)"></div>
    <div class="wall" style="background:linear-gradient(135deg,#b7c8f7,#e3c6ed)" onclick="wallpaper(5)"></div>
   </div>
   <h4>Accent colour</h4>
   <input type="color" id="accent" onchange="accentChange(this.value)">
   <button onclick="toggleDark()">🌗 Toggle Dark</button>
   <hr>
   <button onclick="resetDesktop()">↺ Reset desktop appearance</button>
  </div>
 </div>

 <!-- PROGRESS -->
 <div class="win hidden" id="progress">
  <div class="winhead"><b>📊 Progress</b><div class="winbuttons">
   <button onclick="minWin('progress')">_</button><button onclick="closeWin('progress')">×</button>
  </div></div>
  <div class="content">
   <h3>Task progress</h3>
   <div class="bar"><div id="pTaskBar"></div></div>
   <div id="pTasks"></div>
   <hr>
   <h3>Chapter progress</h3>
   <div class="bar"><div id="pChapBar"></div></div>
   <div id="pChapters"></div>
  </div>
 </div>
</div>

<!-- DOCK -->
<div id="dock">
 <button onclick="openWin('focus')">🌙 Focus</button>
 <button onclick="openWin('notes')">📝 Notes</button>
 <button onclick="openWin('tasks')">📋 Tasks</button>
 <button onclick="openWin('chapters')">📚 Chapters</button>
 <button onclick="openWin('custom')">🎨 Desk</button>
 <button onclick="openWin('progress')">📊 Progress</button>
</div>

<script>
const $=id=>document.getElementById(id);
function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function put(k,v){localStorage.setItem(k,JSON.stringify(v))}

// LOCK CLOCK
function updateLockClock(){
 const now=new Date();
 $("lockClock").textContent=now.toLocaleTimeString([],{
  hour:"2-digit",minute:"2-digit"
 });
 $("lockDate").textContent=now.toLocaleDateString([],{
  weekday:"long",day:"numeric",month:"long",year:"numeric"
 });
}
updateLockClock();
setInterval(updateLockClock,1000);
$("enterDesk").onclick=()=> $("lockScreen").classList.add("hidden");

$("today").textContent=new Date().toLocaleString(undefined,{
 weekday:"long",month:"long",day:"numeric",year:"numeric"
});

// WINDOWS
let z=10;
function front(w){z++;w.style.zIndex=z}
function openWin(id){let w=$(id);w.classList.remove("hidden");front(w)}
function closeWin(id){$(id).classList.add("hidden")}
function minWin(id){closeWin(id)}
document.querySelectorAll(".win").forEach(w=>{
 w.addEventListener("mousedown",()=>front(w));
 w.addEventListener("touchstart",()=>front(w),{passive:true});
});

// DRAG WINDOWS
document.querySelectorAll(".win").forEach(w=>{
 const h=w.querySelector(".winhead");
 let drag=false,dx=0,dy=0;
 h.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;
  h.setPointerCapture(e.pointerId);
 });
 h.addEventListener("pointermove",e=>{
  if(!drag)return;
  let x=e.clientX-dx,y=e.clientY-dy;
  x=Math.max(0,Math.min(window.innerWidth-w.offsetWidth,x));
  y=Math.max(0,Math.min(window.innerHeight-w.offsetHeight,y));
  w.style.left=x+"px";w.style.top=y+"px";
 });
 h.addEventListener("pointerup",()=>drag=false);
 h.addEventListener("pointercancel",()=>drag=false);
});

// TIMER
let seconds=1500,timer=null;
function showClock(){
 let val=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
 $("clock").textContent=val;
 const fc=$("fclock");if(fc)fc.textContent=val;
}
function startTimer(){
 if(timer)return;
 timer=setInterval(()=>{
  if(seconds<=0){
   pauseTimer();
   alert("Focus session completed!");
   return;
  }
  seconds--;showClock();
 },1000);
}
function pauseTimer(){clearInterval(timer);timer=null}
function resetTimer(){pauseTimer();seconds=Number($("minutes").value||25)*60;showClock()}
function changeMinutes(){resetTimer()}
showClock();

function fullFocus(){
 if($("fullScreenFocus"))return;
 const o=document.createElement("div");
 o.id="fullScreenFocus";
 o.innerHTML='<h2>🌙 DEEP FOCUS</h2><div id="fclock" style="font-size:clamp(60px,12vw,100px);font-weight:800">25:00</div><div id="ftitle"></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button id="fsStart">▶ Start</button><button id="fsPause">⏸ Pause</button><button id="fsReset">↺ Reset</button><button id="fsExit">Exit</button></div>';
 document.body.append(o);
 $("ftitle").textContent=$("focusTitle").value;
 showClock();
 $("fsStart").onclick=startTimer;
 $("fsPause").onclick=pauseTimer;
 $("fsReset").onclick=resetTimer;
 $("fsExit").onclick=()=>o.remove();
}

// NOTES
$("noteText").value=get("sh_notes","");
$("noteText").addEventListener("input",()=>{
 put("sh_notes",$("noteText").value);
 $("noteStatus").textContent="✓ Autosaved";
});
function saveNotes(){put("sh_notes",$("noteText").value);$("noteStatus").textContent="✓ Saved"}
function clearNotes(){
 if(confirm("Clear your notes?")){
  $("noteText").value="";put("sh_notes","");$("noteStatus").textContent="Cleared";
 }
}

// TASKS
let tasks=get("sh_tasks",[]);
function renderTasks(){
 $("taskList").innerHTML="";
 tasks.forEach((t,i)=>{
  const d=document.createElement("div");d.className="task";
  const c=document.createElement("input");c.type="checkbox";c.style.width="auto";c.checked=t.done;
  c.onchange=()=>{tasks[i].done=c.checked;put("sh_tasks",tasks);renderTasks()};
  const s=document.createElement("span");s.textContent=t.text;
  if(t.done)s.style.textDecoration="line-through";
  const b=document.createElement("button");b.textContent="×";
  b.onclick=()=>{tasks.splice(i,1);put("sh_tasks",tasks);renderTasks()};
  d.append(c,s,b);$("taskList").append(d);
 });
 const done=tasks.filter(t=>t.done).length;
 $("taskBar").style.width=(tasks.length?done/tasks.length*100:0)+"%";
 $("taskInfo").textContent=done+" / "+tasks.length+" completed";
 renderProgress();
}
function addTask(){
 let v=$("taskText").value.trim();if(!v)return;
 tasks.push({text:v,done:false});put("sh_tasks",tasks);
 $("taskText").value="";renderTasks();
}
$("taskText").addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});

// CHAPTERS
let chapters=get("sh_chapters",[]);
function renderChapters(){
 $("chapterList").innerHTML="";
 chapters.forEach((c,i)=>{
  const d=document.createElement("div");d.className="task";
  const s=document.createElement("span");s.textContent=c.subject+" — "+c.name;
  const sel=document.createElement("select");sel.style.width="140px";
  ["Not Started","In Progress","Completed"].forEach(x=>{
   let o=document.createElement("option");o.textContent=x;o.selected=x===c.status;sel.append(o);
  });
  sel.onchange=()=>{chapters[i].status=sel.value;put("sh_chapters",chapters);renderChapters()};
  const b=document.createElement("button");b.textContent="×";
  b.onclick=()=>{chapters.splice(i,1);put("sh_chapters",chapters);renderChapters()};
  d.append(s,sel,b);$("chapterList").append(d);
 });
 renderProgress();
}
function addChapter(){
 let n=$("chapText").value.trim();if(!n)return;
 chapters.push({subject:$("subj").value,name:n,status:"Not Started"});
 put("sh_chapters",chapters);$("chapText").value="";renderChapters();
}
$("chapText").addEventListener("keydown",e=>{if(e.key==="Enter")addChapter()});

// PROGRESS
function renderProgress(){
 let td=tasks.filter(t=>t.done).length;
 $("pTaskBar").style.width=(tasks.length?td/tasks.length*100:0)+"%";
 $("pTasks").textContent=td+" of "+tasks.length+" tasks done";
 let cd=chapters.filter(c=>c.status==="Completed").length;
 $("pChapBar").style.width=(chapters.length?cd/chapters.length*100:0)+"%";
 $("pChapters").textContent=cd+" of "+chapters.length+" chapters done";
}
renderTasks();renderChapters();

// WALLPAPER
const walls=[
"linear-gradient(135deg,#d9caff,#cbe9ff,#ffe0ed)",
"linear-gradient(135deg,#b9e6ff,#c9f5df)",
"linear-gradient(135deg,#ffc8df,#ffdfba)",
"linear-gradient(135deg,#212136,#41305e)",
"linear-gradient(135deg,#d5e7c8,#9cb8a0)",
"linear-gradient(135deg,#b7c8f7,#e3c6ed)"
];
function wallpaper(i){document.body.style.background=walls[i];put("sh_wall",i)}
wallpaper(get("sh_wall",0));

// ACCENT
function accentChange(v){
 document.documentElement.style.setProperty("--accent",v);
 document.querySelectorAll("button").forEach(b=>b.style.background=v);
 put("sh_accent",v);
}
$("accent").value=get("sh_accent","#cbb8ff");
accentChange($("accent").value);

// DARK MODE
function toggleDark(){
 document.body.classList.toggle("dark");
 const state=document.body.classList.contains("dark");
 put("sh_dark",state);
 document.querySelectorAll(".win").forEach(w=>w.classList.toggle("darkwin",state));
}
if(get("sh_dark",false)){
 document.body.classList.add("dark");
 document.querySelectorAll(".win").forEach(w=>w.classList.add("darkwin"));
}

// RESET APPEARANCE
function resetDesktop(){
 if(!confirm("Reset wallpaper, theme and window positions?"))return;
 localStorage.removeItem("sh_wall");
 localStorage.removeItem("sh_accent");
 localStorage.removeItem("sh_dark");
 document.querySelectorAll(".win").forEach(w=>{
  w.style.left="220px";w.style.top="100px";
 });
 location.reload();
}
</script>
</body>
</html>
