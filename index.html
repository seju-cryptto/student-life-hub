
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Desktop 💜</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;color:#49365f}
#desktop{height:100vh;background:linear-gradient(135deg,#d8c9ff,#bde0ff,#f8d9eb);padding:15px;position:relative;overflow:hidden}
.icons{display:grid;grid-template-columns:85px;gap:5px}
.icon{background:transparent;border:0;padding:10px;border-radius:12px;cursor:pointer;color:#49365f;font-size:14px}
.icon:hover{background:#ffffff70}
.icon span{display:block;font-size:32px;margin-bottom:5px}
.win{display:none;position:absolute;top:70px;left:110px;width:min(400px,90vw);height:min(420px,75vh);background:#fff;border-radius:16px;box-shadow:0 8px 30px #5555;overflow:hidden;z-index:5}
.head{background:#e6d9ff;padding:12px;display:flex;justify-content:space-between;font-weight:bold}
.head button{border:0;border-radius:8px;padding:5px 10px;cursor:pointer}
.body{padding:15px;overflow:auto;height:calc(100% - 44px)}
button.action{background:#a78bdb;color:white;border:0;border-radius:9px;padding:10px;margin:4px;cursor:pointer}
input,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:9px}
textarea{min-height:80px}
.note{background:#eee5ff;padding:10px;border-radius:10px;margin:10px 0;overflow-wrap:anywhere}
#bar{position:absolute;bottom:0;height:55px;width:100%;left:0;background:#ffffffbb;display:flex;justify-content:center;align-items:center;gap:8px;z-index:999;padding:5px}
#bar button{border:0;border-radius:10px;padding:10px;cursor:pointer}
#clock{position:absolute;right:10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid button{padding:14px;border:0;border-radius:10px;background:#e9ddff;cursor:pointer;font-size:17px}
.wall{display:block;width:100%;padding:20px;border:0;border-radius:10px;margin:8px 0;cursor:pointer}
</style>
</head>
<body>
<div id="desktop">

<div class="icons">
<button class="icon" onclick="openW('notes')"><span>📝</span>Notes</button>
<button class="icon" onclick="openW('files')"><span>📁</span>My Files</button>
<button class="icon" onclick="openW('calc')"><span>🧮</span>Calculator</button>
<button class="icon" onclick="openW('timer')"><span>⏱️</span>Timer</button>
<button class="icon" onclick="openW('calendar')"><span>📅</span>Calendar</button>
<button class="icon" onclick="openW('wall')"><span>🎨</span>Wallpapers</button>
<button class="icon" onclick="openW('trash')"><span>🗑️</span>Trash</button>
</div>

<!-- NOTES -->
<div class="win" id="notes">
<div class="head">📝 Notes <span><button onclick="minW('notes')">—</button><button onclick="closeW('notes')">✕</button></span></div>
<div class="body">
<input id="nt" placeholder="Title">
<textarea id="nb" placeholder="Write your note..."></textarea>
<button class="action" onclick="saveNote()">Save</button>
<button class="action" onclick="clearNote()">Clear</button>
<div id="notesList"></div>
</div>
</div>

<!-- FILES -->
<div class="win" id="files">
<div class="head">📁 My Files <span><button onclick="minW('files')">—</button><button onclick="closeW('files')">✕</button></span></div>
<div class="body"><h3>Saved notes</h3><div id="filesList"></div></div>
</div>

<!-- CALCULATOR -->
<div class="win" id="calc">
<div class="head">🧮 Calculator <span><button onclick="minW('calc')">—</button><button onclick="closeW('calc')">✕</button></span></div>
<div class="body">
<input id="cd" value="0" readonly style="font-size:25px;text-align:right">
<div class="grid">
<button onclick="ci('7')">7</button><button onclick="ci('8')">8</button><button onclick="ci('9')">9</button><button onclick="ci('/')">÷</button>
<button onclick="ci('4')">4</button><button onclick="ci('5')">5</button><button onclick="ci('6')">6</button><button onclick="ci('*')">×</button>
<button onclick="ci('1')">1</button><button onclick="ci('2')">2</button><button onclick="ci('3')">3</button><button onclick="ci('-')">−</button>
<button onclick="ci('0')">0</button><button onclick="ci('.')">.</button><button onclick="ce()">=</button><button onclick="ci('+')">+</button>
<button onclick="cc()" style="grid-column:span 4">Clear</button>
</div>
</div>
</div>

<!-- TIMER -->
<div class="win" id="timer">
<div class="head">⏱️ Timer <span><button onclick="minW('timer')">—</button><button onclick="closeW('timer')">✕</button></span></div>
<div class="body" style="text-align:center">
<h1 id="td" style="font-size:50px">25:00</h1>
<input id="tm" type="number" min="1" max="180" value="25">
<button class="action" onclick="setT()">Set</button>
<button class="action" onclick="startT()">Start</button>
<button class="action" onclick="pauseT()">Pause</button>
<button class="action" onclick="resetT()">Reset</button>
<p id="ts">Ready ✨</p>
</div>
</div>

<!-- CALENDAR -->
<div class="win" id="calendar">
<div class="head">📅 Calendar <span><button onclick="minW('calendar')">—</button><button onclick="closeW('calendar')">✕</button></span></div>
<div class="body" style="text-align:center">
<h2>Today's date</h2><h3 id="date"></h3><h3 id="day"></h3>
</div>
</div>

<!-- WALLPAPERS -->
<div class="win" id="wall">
<div class="head">🎨 Wallpapers <span><button onclick="minW('wall')">—</button><button onclick="closeW('wall')">✕</button></span></div>
<div class="body">
<button class="wall" style="background:linear-gradient(135deg,#d8c9ff,#bde0ff)" onclick="sw('linear-gradient(135deg,#d8c9ff,#bde0ff)')">💜 Lavender</button>
<button class="wall" style="background:linear-gradient(135deg,#ffcde5,#fff0bd)" onclick="sw('linear-gradient(135deg,#ffcde5,#fff0bd)')">🌸 Pink</button>
<button class="wall" style="background:linear-gradient(135deg,#b9f2df,#d6e9ff)" onclick="sw('linear-gradient(135deg,#b9f2df,#d6e9ff)')">🌿 Mint</button>
<button class="wall" style="background:linear-gradient(135deg,#252447,#55427a);color:white" onclick="sw('linear-gradient(135deg,#252447,#55427a)')">🌙 Midnight</button>
<button class="wall" style="background:linear-gradient(135deg,#fff0bd,#ffcde5,#d9c9ff)" onclick="sw('linear-gradient(135deg,#fff0bd,#ffcde5,#d9c9ff)')">🌈 Dream</button>
</div>
</div>

<!-- TRASH -->
<div class="win" id="trash">
<div class="head">🗑️ Trash <span><button onclick="minW('trash')">—</button><button onclick="closeW('trash')">✕</button></span></div>
<div class="body"><div id="trashList"></div><button class="action" onclick="emptyT()">Empty Trash</button></div>
</div>

<div id="bar">
<button onclick="openW('notes')">📝</button>
<button onclick="openW('files')">📁</button>
<button onclick="openW('calc')">🧮</button>
<button onclick="openW('timer')">⏱️</button>
<button onclick="openW('calendar')">📅</button>
<div id="clock"></div>
</div>
</div>

<script>
const $=x=>document.getElementById(x);
let N=JSON.parse(localStorage.getItem("notes2")||"[]");
let T=JSON.parse(localStorage.getItem("trash2")||"[]");
let Z=10;

function openW(id){
$(id).style.display="block";
$(id).style.zIndex=++Z;
}
function closeW(id){$(id).style.display="none"}
function minW(id){$(id).style.display="none"}

function safe(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function save(){
localStorage.setItem("notes2",JSON.stringify(N));
localStorage.setItem("trash2",JSON.stringify(T));
render();
}
function saveNote(){
let a=$("nt").value.trim(),b=$("nb").value.trim();
if(!a&&!b){alert("Write something first!");return}
N.unshift({id:Date.now(),a:a||"Untitled",b:b});
save();clearNote();
}
function clearNote(){$("nt").value="";$("nb").value=""}

function render(){
$("notesList").innerHTML=N.map(n=>`
<div class="note"><b>${safe(n.a)}</b><p>${safe(n.b).replace(/\n/g,"<br>")}</p>
<button class="action" onclick="del(${n.id})">Delete</button></div>`).join("");

$("filesList").innerHTML=N.map(n=>`
<div class="note"><b>📄 ${safe(n.a)}</b><p>${safe(n.b).replace(/\n/g,"<br>")}</p></div>`).join("")||"No saved notes.";

$("trashList").innerHTML=T.map(n=>`
<div class="note"><b>${safe(n.a)}</b><p>${safe(n.b)}</p>
<button class="action" onclick="restore(${n.id})">Restore</button>
<button class="action" onclick="pd(${n.id})">Delete forever</button></div>`).join("")||"Trash is empty.";
}
function del(id){
let n=N.find(x=>x.id===id);
if(n){T.unshift(n);N=N.filter(x=>x.id!==id);save()}
}
function restore(id){
let n=T.find(x=>x.id===id);
if(n){N.unshift(n);T=T.filter(x=>x.id!==id);save()}
}
function pd(id){T=T.filter(x=>x.id!==id);save()}
function emptyT(){if(confirm("Empty trash?")){T=[];save()}}

// Calculator
function ci(v){
let d=$("cd");
if(d.value==="0"||d.value==="Error")d.value="";
d.value+=v;
}
function cc(){$("cd").value="0"}
function ce(){
try{
let s=$("cd").value;
if(!/^[0-9+\-*/.() ]+$/.test(s))throw 0;
let r=Function("return "+s)();
if(!Number.isFinite(r))throw 0;
$("cd").value=String(r);
}catch(e){$("cd").value="Error"}
}

// Timer
let total=1500,remaining=1500,interval=null;
function showT(){
$("td").textContent=Math.floor(remaining/60).toString().padStart(2,"0")+":"+ (remaining%60).toString().padStart(2,"0");
}
function setT(){
pauseT();
let m=Number($("tm").value);
if(!m||m<1||m>180){alert("Enter 1 to 180 minutes");return}
total=remaining=m*60;showT();$("ts").textContent="Timer set ✨";
}
function startT(){
if(interval)return;
if(remaining<=0)remaining=total;
$("ts").textContent="Focus time 💜";
interval=setInterval(()=>{
remaining--;showT();
if(remaining<=0){pauseT();$("ts").textContent="Completed 🎉";alert("Timer complete!")}
},1000);
}
function pauseT(){clearInterval(interval);interval=null}
function resetT(){pauseT();remaining=total;showT();$("ts").textContent="Ready ✨"}

// Wallpaper
function sw(b){
$("desktop").style.background=b;
localStorage.setItem("wall2",b);
}

// Date and clock
function tick(){
let d=new Date();
$("clock").innerHTML=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+"<br>"+d.toLocaleDateString();
$("date").textContent=d.toLocaleDateString([],{day:"numeric",month:"long",year:"numeric"});
$("day").textContent=d.toLocaleDateString([],{weekday:"long"});
}
tick();setInterval(tick,1000);

if(localStorage.getItem("wall2"))sw(localStorage.getItem("wall2"));
render();showT();

// Bring window to front on click
document.querySelectorAll(".win").forEach(w=>{
w.addEventListener("mousedown",()=>w.style.zIndex=++Z);
});
</script>
</body>
</html>
